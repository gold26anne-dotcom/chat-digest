*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;font-size:15px;line-height:1.7;padding-inline:16px;padding-block:20px 60px}

.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.12);filter:blur(2px)}

.badge{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:6px 16px;font-size:13px;font-weight:500}

.note{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:12px 16px;font-size:13.5px;color:var(--muted)}

— 검색량 9~10만·오가닉 15위권 메인키워드와 검색량 7~8천·오가닉 1~3위 서브키워드 중 어디서 더 팔리느냐에 대부분 2번 응답, 정답은 서브키워드이며 메인에서 100건 팔릴 때 서브는 약 140건이라는 답 · 한 제품에서 한 달 판매되는 키워드는 보통 100개 이상이고 순위는 시크릿모드, 키워드별 판매량은 비즈니스 인사이트 판매분석과 광고보고서로 본다는 답 · 몇 개 키워드를 잡아야 하느냐는 질문에는 원료·키워드 분포를 모르면 답하기 어려우니 케이스 바이 케이스로 사안을 놓고 물어 달라는 답 · 썸네일·상세페이지는 디자이너에게 맡기고 본인은 광고일지·오가닉/광고 판매 비중·키워드 분석에 시간을 쓴다는 답, 첫 런칭 한 달은 상세페이지·가구매 비용 때문에 마이너스가 날 수 있으니 주식처럼 길게 보라는 답 · 오후에 코치가 '소싱하는 기준' 세 가지(자동완성 검색어 점수 매기기 → 비즈니스 인사이트 검색량 순 정렬과 1~10위 제품 확인 → 메인키워드 시크릿모드 오가닉 1~10위 판매량 계산) 루틴을 파라다이스 그레인 예시로 공유 · 비즈니스 인사이트는 처음엔 도움받고 이후 가입하라는 답(첫달 무료), 코치와 1:1은 진도 빠른 분 위주이며 대면등록자는 강사가 봐 준다는 답 · 광고 데이터 분석 라이브 강의 요청에는 아직 조건이 안 맞아 추후 고민 중이라는 답 · 영업신고 서류의 위탁생산계약서는 OEM 계약서(에이브바이오랩스)이고 임대차계약서는 사업자 주소가 임대사무실일 때만 해당하며 구청마다 달라 전화 확인하라는 수강생끼리의 답 · 약병 색·유광/무광은 라벨과 어울리게 고르면 되고 유광이 더 선명하게 출력된다는 수강생 정보, 라벨 인쇄는 화·금이라 월·목에 확정하면 바로 들어간다는 팁 · 공장강의 자료가 메일로 발송됐고 설문 메일주소를 잘못 적은 경우 강사에게 다시 보내라는 답 · 후기 리워드는 밤에 취합해 보낸다는 답 · 건온연 카페에 1기 공장견학 후기가 잇따라 올라옴 · 에이브 대표가 말한 정부지원금은 강사도 아직 안 받았고 알아보려 한다는 답 · 연말에 매출 성과자 대표들과 식사하고 싶다는 강사 예고", "qa": [{"q": "검색량 9~10만·오가닉 15위권 메인키워드와 검색량 7~8천·오가닉 1~3위 서브키워드 중 어디서 더 많이 팔리나요?", "a": "서브키워드. 실제 사례로 메인키워드에서 약 100건 팔릴 때 서브키워드에서는 약 140건이 팔렸다(한 제품 두 키워드 합쳐 약 240건, 매출 약 1,600만원). 메인키워드 상위를 잡으면 좋지만 서브키워드만 제대로 먹어도 판매는 충분히 일어난다. 한 제품에서 한 달 동안 판매가 일어나는 키워드는 보통 100개 이상이다.", "by": "코치"}, {"q": "키워드 순위와 키워드별 판매량은 어디서 확인하나요?", "a": "순위는 시크릿모드에서 검색한 오가닉 순위를 본다. 해당 키워드로 검색해서 팔린 양은 비즈니스 인사이트의 판매분석 카테고리와 광고보고서에서 확인한다.", "by": "코치"}, {"q": "키워드를 몇 개나 잡고 가야 하나요? 키워드별로 다 검색해서 판매량을 체크해야 하나요?", "a": "어떤 원료인지, 그 원료의 키워드가 어떻게 포진돼 있는지 모르는 상태에서는 답하기 어렵다. 케이스 바이 케이스라 해당 사안을 놓고 물어보면 정확한 가이드를 준다. 판매하다 '이 키워드에서 많이 팔리네' 싶으면 그때 연락 달라고 했다.", "by": "코치"}, {"q": "원료를 소싱할 때 데이터 관점에서 어떤 기준으로 보나요?", "a": "세 가지를 본다. 1) 자동완성 검색어 — 'ㅍ', '파', '파ㄹ', '파라'처럼 한 글자씩 넓혀 검색하면서 반복 등장하는 키워드에 1점씩 점수를 매겨 메인키워드 후보를 뽑는다(파라다이스 그레인은 '레'보다 '래'로 검색이 더 많고 '식약청 인증' 키워드가 반복 상단에 뜬다). 2) 비즈니스 인사이트에서 메인키워드를 검색해 관련 키워드를 검색량 순으로 줄 세우고 1~10위 제품을 하나씩 열어 본다. 3) 메인키워드를 시크릿모드로 검색해 오가닉 1~10위 제품의 판매량을 계산한다. 코치는 오가닉 3위권 판매량과 가져갈 마진을 계산해 해볼 만하면 들어간다. 평생 공식이 아니라 참고용이며 중요한 판단은 같이 논의하자고 했다.", "by": "코치"}, {"q": "썸네일·상세페이지는 직접 만드시나요? 디자이너에게는 어떻게 넘기나요?", "a": "코치는 디자이너에게 전부 맡긴다. 처음에는 기획안을 줬고 지금은 말 안 해도 알아서 해 준다. 본인은 광고일지, 오가닉과 광고 판매 비중, 키워드 분석에 시간을 많이 쓴다. 수강생에게는 비용이 안 들게 AI를 추천했을 것이라고 했다.", "by": "코치"}, {"q": "첫 런칭 한 달에 마이너스가 나는 원인은 뭔가요?", "a": "상세페이지·가구매 비용 등 초기 지출을 합치면 첫달은 마이너스가 나는 경우도, 안 나는 경우도 있다. 지금 아무것도 안 해도 월 800 정도 벌어 오는 효자제품도 첫달엔 마이너스였다. 주식이 첫달 -30%를 찍다가 1년 뒤 2~300%가 되는 것과 같은 맥락으로 보면 속이 편하다.", "by": "코치"}, {"q": "비즈니스 인사이트 유료회원 가입을 해야 하나요? 제품등록 후에 가입하는 건가요?", "a": "처음에는 도움을 받고 이후에 가입하는 것을 추천한다. 첫달은 무료일 것이다. 대면등록하는 분들은 처음에 강사에게 도움을 받으면 된다.", "by": "코치"}, {"q": "코치님과 1:1 톡은 안 되나요?", "a": "진도가 빠른 분 위주로 소통하고 있고 어느 정도 단계에서 만나야 서로 효율적이라 검토해 보겠다고 했다. 대면등록자는 강사에게 받으면 되고, 코치는 시간 여유가 생길 때마다 톡방에 오겠다고 했다.", "by": "코치"}, {"q": "광고 데이터 분석 라이브 강의를 열어 줄 수 있나요?", "a": "코치가 정말 좋아하는 영역이지만 아직 모든 수강생에게 알려 주기에는 상황과 조건이 맞지 않아 추후 어떻게 다가갈지 고민 중이다.", "by": "코치"}, {"q": "영업신고 교육 이수 후 내는 위탁생산계약서·임대차계약서는 각각 에이브바이오랩스 계약서와 3PL 계약서를 말하나요?", "a": "위탁생산계약서는 OEM 계약서(에이브바이오랩스)가 맞다. 임대차계약서는 사업자등록증상 주소가 임대사무실일 때만 해당하고 자택이면 해당 없다. 구청마다 달라서 전화해 보고 가는 게 좋으며 사본을 제출한 경우도 있다.", "by": ""}, {"q": "약병은 갈색/흰색, 유광/무광 중 어떤 걸로 많이 하나요?", "a": "라벨 디자인과 어울리는 색으로 하면 된다. 유광이 더 선명하게 출력된다. 흰색 통에 무광 + 눈에 띄는 파란 라벨로 한 경우, 집에 있는 약병을 참고해 둘 다 유광으로 한 경우가 있었다. 라벨 인쇄는 매주 화·금이라 월·목에 확정하면 바로 인쇄되고 수·월에 출고일자 메일을 받는다.", "by": ""}, {"q": "설문에 메일주소를 잘못 적었는데 공장강의 자료는 어떻게 받나요?", "a": "설문은 재참여가 안 되니 강사에게 메일주소를 다시 보내면 된다.", "by": "강사(하니쌤)"}, {"q": "후기를 썼는데 리워드를 아직 못 받았어요. 순차적으로 보내 주시나요?", "a": "밤에 한 번 더 취합해서 보내 줄 예정이다.", "by": "강사(하니쌤)"}, {"q": "에이브 대표님이 말한 정부지원금을 받으셨나요?", "a": "아직 안 받았고, 이번에 듣다 보니 혹해서 알아보려 한다고 했다.", "by": "강사(하니쌤)"}], "notices": ["공장강의 자료 메일 발송 — 설문 메일주소를 잘못 적었으면 강사에게 다시 알릴 것", "공장견학 후기 리워드는 밤에 취합해 순차 발송", "연말에 매출 성과를 낸 대표들과 식사 자리 예정 — 10월 안에 제조 들어가야 한다는 분위기"], "links": [], "label": "10/1 (목)"}, {"date": "2026-09-30", "summary": "공장견학 후기는 건온연 카페에 올리면 되고 자료는 강사에게 전달되면 공유될 것 같다는 수강생 답, 평점 매우만족·만족이 강사에게 힘이 된다는 독려 · 수강생들 후기 등록 · 강사가 공장강의 리 면 추후 견학은 어렵냐는 질문에 공장견학은 이번 하루뿐이라는 강사 답 · 오전반 신청했는데 명단에 누락됐다는 문의는 코치 확인 요청 후 답변 대기 · 운영진의 패키지 디자인 무료 프로모션(10/22까지) 재안내와 추석·10월 연휴로 상담이 몰리니 9/22(화)까지 미리 상담 신청 권장 · 판매량 '만족했어요' 표시가 판매순위 5위인 상품이면 스킵해야 하느냐는 질문은 답변 대기 · 지난주 견적 문의 회신이 없다는 문의에 담당자에게 직접 연락해 보라는 운영진 답, 대표번호로 전화해 당일 연락받기로 함 · 브랜드와 판매자 상호가 다르면 판매자 사업자의 제품 브랜드가 맞다는 코치 확인 · 남성 위주 원료가 여성·남녀무관 원료보다 덜 팔리느냐는 질문에 원료마다 다르며 키워드 검색량과 판매량이 더 중요하다는 코치 답 · 제약회사와 개인판매자를 구분하는 법 질문에 소싱·판매에 그 구분은 무의미하다는 코치 답 · 한 수강생의 첫 소싱 제품이 10월 13일 출고 예정이라는 소식", "qa": [{"q": "쿠팡에서 '판매자계정이 가계정으로 확인되지 않도록 상품등록 및 판매 요청바랍니다'라는 전화·문자가 오는데 형식적인 건가요?", "a": "맞다. 앞으로도 이렇게 하라 저렇게 하라는 연락이 계속 올 텐데 가볍게 넘기면 된다.", "by": "강사(하니쌤)"}, {"q": "공장견학 지금도 신청 가능한가요?", "a": "가능하다. 신청 기간은 9/22(화) 오후 1시까지이며 당일 오전 기준 오전반 4자리·오후반 36자리가 남았다(같은 날 오후 오전반 마감). 정상 신청했는데 명단에 없으면 코치에게 1:1 문의.", "by": "코치"}, {"q": "이번이 아니면 추후에 공장견학은 어렵나요?", "a": "공장견학은 이번 하루뿐이다.", "by": "강사(하니쌤)"}, {"q": "지난주 제조 견적 문의를 했는데 아직 회신이 없습니다.", "a": "담당자에게 직접 연락하면 빠르게 안내받을 수 있다. 수강생이 대표번호로 전화해 당일 연락받기로 했다.", "by": "운영진"}, {"q": "브랜드가 '뉴트리**', 판매자가 '(주)위드*'면 사업자가 위드*이고 그 사업자의 제품 브랜드가 뉴트리**인 건가요?", "a": "맞다.", "by": "코치"}, {"q": "아르기닌·밀크시슬처럼 남성 위주 원료는 여성 다이어트 성분이나 남녀무관 제품보다 판매량이 적을까요?", "a": "원료마다 너무 다르다. 키워드 검색량과 판매량을 보는 게 더 중요하다.", "by": "코치"}, {"q": "쿠팡 판매자가 제약회사인지 개인판매자인지는 판매자샵의 상품 수와 광고 모양으로 구분하면 되나요?", "a": "제약회사와 개인판매자 구분은 무의미하다(데이즈온도 제약회사가 아님). 굳이 나누자면 제조원과 판매원이 같은 큰 업체면 직접 제조·판매하는 회사, 제조원은 별도 식품제조업체이고 판매원이 다른 브랜드사면 제품을 만들어 파는 브랜드일 가능성이 높다. 소싱이나 판매를 할 때 개인사업자·OEM·제약회사를 구분할 필요는 없다.", "by": "코치"}], "notices": ["공장견학 신청 명단 업데이트 — 정상 신청했는데 명단에 없으면 코치에게 1:1 문의. 신청 기간 9/22(화) 오후 1시까지, 오전반은 당일 마감", "공장견학은 이번 하루만 진행, 추후 재진행 없음", "에이브바이오랩스 패키지 디자인 무료 프로모션은 10/22(목)까지 — 추석(9/24~27)·10/5·10/9 연휴로 상담이 몰리니 추석 전 문의는 9/22(화)까지 권장. 상담 전 준비: 제품 컨셉·희망 원료·희망 제조 수량, 가능하면 사업자등록증·일반식품 유통전문판매원"], "links": [{"label": "공장견학 명단 확인(노션)", "url": "https://app.notion.com/p/aev-seminar/x-1-3ddea59976ba80a5b5e3f3aedd1b9f98?source=copy_link"}, {"label": "공장견학 신청 구글폼(2차)", "url": "https://forms.gle/UrrrrzL38GQ3xzrK6"}, {"label": "에이브바이오랩스 제조 상담 신청", "url": "https://aevbiolabs.com/contact-us"}], "label": "9/17 (목)"}, {"date": "2026-09-16", "summary": "공장견학은 따로 신청해야 하느냐는 질문에 오늘 신청을 올리겠다는 강사 답과 오전반은 점심식사 후 해산이라 표 예매한 분은 먼저 일어나도 된다는 안내 · 수강료 전자세금계산서 발행 확인이 안 된다는 문의는 머니업클래스 측에 전달돼 담당자가 연락하기로 하고 해결 · 오후반 저녁식사가 나오는지 묻는 질문에 오후반 저녁·오전반 점심 모두 있다는 강사 답 · 코치의 공장견학 신청 구글폼 오픈 공지(명단 확정 후 시간 변경 불가, 동반 입장 불가, 50명 한정) · 영업신고 때 요구된 건강진단 결과서가 뭔지 묻는 질문에 처음 보는 것이라 지자체 위생과에 문의하라는 강사 답 · 쿠팡이 보낸 판매자 강화기준안은 주문 들어오면 배송 잘 보내라는 내용이라 걱정할 것 없다는 코치 답과 출고 불가 일정은 미리 휴무일로 설정해 두겠다는 수강생 팁 · 스마트스토어 가입 화면 질문에 강의자료에 방법이 나와 있다는 수강생 답과 2~4강 자료를 수강생끼리 나눔 · 상품 왼쪽 상단 '쿠팡추천' 표시는 광고가 아니라 잘 팔려서 쿠팡이 자체 기준으로 다는 것이고 광고는 오른쪽 하단에 표시된다는 답, 기준은 쿠팡만 안다는 코치 답 · 썸네일에 쿠팡추천 문구를 넣으면 썸네일 제재와 같은 맥락이라는 코치 답 · 원료 소싱은 아직 원료 리포트에 많이 의존한다는 후기와 1교시 마인드셋 강의가 힘이 된다는 소감", "qa": [{"q": "공장 현장방문은 따로 신청해야 하나요, 아니면 두 시간대 중 하나로 그냥 가면 되나요?", "a": "신청을 받는다. 당일 오후 1시에 코치가 공장견학 신청 구글폼을 열었다. 명단 확정 후에는 시간 변경이 안 되고, 본인 외 동반 입장 불가, 견학 인원은 50명으로 한정된다.", "by": "강사(하니쌤)·코치"}, {"q": "공장견학 오전반인데 기차표를 예매했으면 어떻게 하나요?", "a": "오전반은 점심식사 후 해산이라 표를 예매한 분은 먼저 일어나도 된다.", "by": "강사(하니쌤)"}, {"q": "공장견학 오후반은 저녁식사가 나오나요?", "a": "오후반 저녁식사 있고, 오전반도 점심이 있다.", "by": "강사(하니쌤)"}, {"q": "입금 후 사업자등록증을 보내고 세금계산서 발행을 요청했는데 발행 확인이 안 됩니다.", "a": "머니업클래스 측으로 내용을 전달했고, 담당자가 확인 후 전화나 카톡으로 연락한다. 당일 해결됐다.", "by": "코치"}, {"q": "영업신고를 하려는데 '건강진단 결과서'를 요구합니다. 이게 뭔가요?", "a": "강사도 처음 보는 서류라 지자체 위생과에 연락해 물어보라고 했다. (9/21에 수강생이 '구 보건증'의 바뀐 이름이라고 공유)", "by": "강사(하니쌤)"}, {"q": "쿠팡에서 '판매자 강화기준안'을 보내왔는데 어떤 내용인가요?", "a": "주문이 들어오면 배송을 잘 보내 달라는 내용이다. 주문이 와도 배송을 안 하는 셀러는 판매자점수가 깎이는데 우리는 그럴 일이 없으니 걱정하지 않아도 된다. 출고 불가 일정은 미리 휴무일로 설정해 두면 된다는 수강생 팁.", "by": "코치"}, {"q": "스마트스토어 가입 중인데 이 화면에서 어떻게 하나요?", "a": "강의자료에 하는 방법이 나와 있다고 수강생이 안내했다.", "by": ""}, {"q": "상품 왼쪽 상단에 붙는 '쿠팡추천'은 광고인가요? 달리는 기준을 알 수 있나요?", "a": "광고가 아니라 잘 팔려서 쿠팡이 자체적으로 붙이는 것이고, 광고는 오른쪽 하단에 표시된다. 자체 기준으로 달리며 그 기준은 쿠팡만 안다.", "by": "코치"}, {"q": "썸네일에 '쿠팡추천' 문구를 넣으면 제재당하나요?", "a": "썸네일 제재와 같은 맥락이다(넣지 말 것).", "by": "코치"}], "notices": ["공장견학 신청 구글폼 오픈 — 명단 확정 후 시간 변경 불가(변경은 확정 전 코치에게 1:1 문의), 장소가 협소해 본인 외 동반 입장 불가, 견학 인원 50명 한정", "공장견학 오전반은 점심식사 후 해산(표 예매한 분은 먼저 이동 가능), 오후반은 저녁식사 제공"], "links": [{"label": "공장견학 신청 구글폼(1차)", "url": "https://forms.gle/Dskqqg3NNJyjNjg66"}, {"label": "공장견학 온라인 팜플렛(노션)", "url": "https://link24.kr/4bkoBaa"}, {"label": "견학 관련 문의 오픈채팅(코치)", "url": "https://open.kakao.com/o/sL2jcFwi"}], "label": "9/16 (수)"}, {"date": "2026-09-15", "summary": "진도가 느려 뒤늦게 따라가는 분들을 위해 한 수강생이 날짜별 톡방 정리 페이지를 만들어 공유 · 너무 늦어지는 것 아니냐는 걱정에 조급해하지 말고 본인 속도로 가는 게 가장 중요하다는 코치 답 · 쿠팡에서 언제 상품등록할 거냐는 전화가 왔다는 질문에 판매자 가입 후 광고·그로스·관리 담당자 등에게서 전화가 오기 시작하며 사전조사나 프로모션 안내 차원이니 초반엔 신경 쓰지 말라는 코치 답 · 일정 매출이 생기면 광고담당자가 붙는데 매출최적화 광고를 켜라는 권유는 보장이 아니고 광고비가 크게 늘어나니 가볍게 듣고 실행하지 말라는 코치 조언 · 29일 공장견학 오전반이 정확히 14시에 끝나는지(기차표 예매 때문) 묻는 질문에 Q&A가 길어질 수 있어 확답은 어렵다는 코치 답", "qa": [{"q": "쿠팡에서 언제쯤 상품등록할 건지 묻는 전화가 왔는데, 다른 분들도 받으셨나요?", "a": "쿠팡 판매자로 가입하면 광고담당자·그로스담당자·관리담당자 등 여러 곳에서 전화가 오기 시작한다. 지금 받은 전화는 사전조사나 상품등록 이후 프로모션 안내 차원이니 초반에는 크게 신경 쓰지 않아도 된다. 보통 일정 매출 이상이 되면 광고담당자가 붙어 전화를 받게 된다.", "by": "코치"}, {"q": "쿠팡 광고담당자가 붙으면 그 말을 따라야 하나요?", "a": "광고담당자는 광고를 많이 쓰게 하는 역할이라 가볍게 듣고 실행은 하지 않는 게 좋다. '매출최적화 광고를 켜면 매출이 늘 것 같다'는 말은 보장이 아니고, 매출최적화로 집행하면 광고비가 어마어마해진다. 매출이 저조할 때 특히 혹하기 쉬우니 강사·코치진의 가이드를 기준으로 삼을 것.", "by": "코치"}, {"q": "29일 공장견학 오전반 끝나는 시간이 정확히 14시인가요? 기차표 예매 때문에 여쭤봅니다.", "a": "Q&A가 길어질 수 있어 확답은 어렵다. (다음날 강사가 오전반은 점심식사 후 해산이라 표를 예매한 분은 먼저 일어나도 된다고 보충)", "by": "코치"}, {"q": "가족 명의로 하려다 보니 진도가 많이 늦어질 것 같은데 괜찮을까요?", "a": "조급해하지 말 것. 내년이나 5년 후에 시작하는 분들도 있을 시장이니 본인 속도로 가는 게 가장 중요하다.", "by": "코치"}], "notices": [], "links": [{"label": "수강생이 공유한 날짜별 톡방 정리 페이지", "url": "https://gold26anne-dotcom.github.io/chat-digest/g/57c5eca17622.html"}], "label": "9/15 (화)"}, {"date": "2026-09-14", "summary": "이번주 토요일 줌라이브에 Q&A 시간이 있으니 복습하고 질문을 준비하라는 강사 안내 · 4주차 강의(최대표 광고 특강)는 오늘 오후 업로드 예정이라는 답 · 29일 공장견학은 오전 10~2시, 오후 3~7시라는 답과 익산역에서 공장까지 택시 15분(10km)이라는 답 · 기차표·연차 때문에 견학 시간 투표를 빨리 열어 달라는 건의에 오전·오후반 TO는 없고 자리 배분용이며 바로 투표를 올리겠다는 답 · 라벨·단상자 필수 표기사항 질문에 제조사가 알아서 해 주며 제품명과 총내용량당 원료 함량은 필수이고 품목보고 후 한글표시사항을 워드로 준다는 답 · 운영진의 4주차 정규강의 업로드 안내 · 이번주 원료 리포트 발송과 다음 주부터 매주 TOP10 중심 트렌드 리포트 발행 예고 · 운영진의 에이브바이오랩스 패키지 디자인 무료 프로모션 안내(최소 MOQ 이상, 10/22까지 제조 시작) · 재발주 수량은 초도 배수만 되느냐는 질문에 수량은 자유롭고 수량별 단가만 다르다는 확인", "qa": [{"q": "4주차 강의는 언제 올라오나요?", "a": "오늘(9/14) 오후에 업로드 예정. 4주차 광고 강의는 무료강의에 함께 나왔던 최대표가 특강을 했다. 오후 3시 55분에 업로드 완료가 공지됐다.", "by": "강사(하니쌤)"}, {"q": "29일 공장견학은 몇 시부터 몇 시까지인가요?", "a": "오전반 10시~2시, 오후반 3시~7시.", "by": "강사(하니쌤)"}, {"q": "익산역에서 에이브바이오랩스 공장까지 택시로 얼마나 걸리나요?", "a": "15분 거리, 약 10km.", "by": ""}, {"q": "기차표·연차 때문에 견학 시간 투표를 빨리 진행해 줄 수 있나요? 오전·오후반 TO가 있나요?", "a": "따로 TO는 없고 온라인 수강생까지 함께 와서 자리가 부족할까 봐 나누는 것이다. 여건대로 오면 되며, 건의대로 빠른 투표를 올리겠다고 했다.", "by": "강사(하니쌤)"}, {"q": "라벨이나 단상자 디자인에 필수 표기사항이 따로 있나요? 제조사 디자인 지원을 받으면 신경 안 써도 되나요?", "a": "에이브바이오랩스에 제조를 맡기면 알아서 해 준다. 제품명은 필수이고 하단에 총내용량당 원료 함량이 필수로 들어가야 한다. 제조가 시작되면 품목보고 후 라벨에 들어갈 한글표시사항을 워드 파일로 전달해 준다.", "by": "강사(하니쌤)"}, {"q": "2,000개 제조 후 재발주 시 초도 발주분의 배수(2,000·4,000·6,000개)로만 가능한가요?", "a": "운영진은 맞다며 자세한 것은 에이브바이오랩스에 문의하라고 했고, 수강생이 직접 확인한 결과 수량은 자유롭게 조정 가능하고 수량별 단가만 달라진다.", "by": "운영진"}], "notices": ["이번주 토요일 줌라이브에서 Q&A 시간 진행 — 복습하고 질문 준비", "9월 12일 진행된 4주차 정규강의 업로드 완료 — 머니업클래스 사이트 [내 강의실]에서 시청, 강의 자료는 1교시 영상 하단에서 다운로드", "이번주 원료 리포트 발송. 다음 주부터 매주 브랜드·원료 TOP10 중심 트렌드 리포트 발행 예정", "[하니쌤 1기] 에이브바이오랩스 패키지 디자인 무료 프로모션 — 로고·라벨·단상자 디자인·목업 이미지 무료. 조건: 최소 MOQ 이상 제조, 수강일로부터 2개월 이내 제조 시작, 혜택 기간 2026.10.22까지(추가 제조도 MOQ 이상이면 지원). 상담 전 준비: 제품 컨셉·희망 원료·희망 수량·사업자등록증·유통전문판매업 신고증", "29일 익산 공장견학 오전반 10~2시, 오후반 3~7시. 시간 투표 곧 올릴 예정"], "links": [{"label": "머니업클래스 사이트(내 강의실)", "url": "https://www.moneyupclass.com/"}, {"label": "강의 수강 방법 안내", "url": "https://buly.kr/CqTRkj"}, {"label": "머니업클래스 카카오톡 채널(수강 문의)", "url": "https://pf.kakao.com/_mxffBn"}, {"label": "에이브바이오랩스 제조 상담 신청", "url": "https://aevbiolabs.com/contact-us"}], "label": "9/14 (월)"}, {"date": "2026-09-13", "summary": "동기 연락처 취합 릴레이가 이어짐 · 이 방에서 카톡 프로필 이름 수정이 안 된다는 질문에 프로필을 실명으로 바꾼 뒤 입장하면 된다는 수강생 답 · 29일 익산 공장견학 오후반에 서울에서 차로 같이 갈 사람을 찾는 글과 오전·오후반 신청은 아직 안 받는다는 답 · a": [{"q": "위생과에서 집 주소는 창고로 분류할 수 없다며 창고 계약서를 첨부하라고 반려했는데 어떻게 하나요?", "a": "물류창고 계약서는 3PL 계약서를 제출하면 된다. 코치가 공지글 댓글에 올려 두었다.", "by": "강사(하니쌤)"}, {"q": "사업자등록증 종목에 전자상거래 소매업 하나만 있는데 3개를 넣어야 하나요?", "a": "1개만 있어도 된다. 건강식품 2종 신고증을 보유하면 사업자등록증에 전자상거래 소매업만 표기돼도 온라인 판매에 문제가 없고, 표기를 바꾸고 싶으면 세무서에 신고증 2종과 신분증을 가져가면 변경할 수 있다.", "by": "강사(하니쌤)"}, {"q": "정부24에서 건강기능식품 영업신고 하나만 하면 신고증 2가지가 다 나오나요?", "a": "동시에 나오지 않고 건강기능식품 일반판매업과 유통전문판매업을 각각 따로 신청한다. 수강생이 두 신고의 단계별 캡처(8장·15장)를 올려 주었다.", "by": "강사(하니쌤)"}, {"q": "임대차계약서 임차인이 남편 명의인데 제 이름으로 영업신고 주소로 쓸 수 있나요?", "a": "담당자가 추가 증빙을 요청할 수 있다. 사업자등록은 이미 이 주소로 되어 있고 임대차는 배우자 명의인데 어떤 추가 서류가 필요한지 물어보면 사용승낙서나 전대 관련 서류 등을 안내해 준다. (이후 해당 수강생은 임대차계약서 없이 접수비 5만 원대와 세금 납부로 신고증 2개를 받았다.)", "by": "강사(하니쌤)"}, {"q": "유통전문판매업은 됐는데 건강식품 유통업을 추가할 거냐고 담당자가 묻는데 맞나요?", "a": "건강식품은 유통업이 아니라 '건강기능식품 일반판매업'이다. 유통전문판매업과 건강기능식품 일반판매업 두 가지를 받으면 된다.", "by": "강사(하니쌤)"}, {"q": "브랜드명에 Health, Balance, Better Tomorrow 같은 단어를 덧붙여도 되나요?", "a": "쓰면 안 되는 단어는 없다. 마음대로 설정해도 된다.", "by": "강사(하니쌤)"}, {"q": "OEM 계약서에 계약 날짜가 안 보인다며 위생과에서 계속 반려하는데 어떻게 했나요?", "a": "계약서를 캡처해 사진으로 복사한 뒤 한글 파일로 만들어 담당자 메일로 보내 통과했다. 구청에 직접 방문해 해결한 경우도 있다.", "by": ""}, {"q": "3주차 Q&A 끝부분, 판매 중인 원료의 검색 키워드가 바뀌면 어떻게 하나요?", "a": "신규 키워드는 갑자기 커지지 않고 천천히 쌓이며, 판매페이지 점수가 높으면 쿠팡이 알아서 노출시켜 준다. 더 빨리 잡으려면 해당 키워드를 수동광고 CPC 입찰가를 높여 노출시켜 구매를 일으킨 뒤 오가닉 순위를 올리거나, 그 키워드로 가구매 최적화 작업을 한다.", "by": "코치"}, {"q": "나중에 가구매를 위해 번들 옵션 1번을 판매자배송으로 남겨두는 방법밖에 없나요?", "a": "그런 사례도 있다는 예시였을 뿐이고, 로켓에 모든 옵션을 입고시킨 다음 진행해도 무방하다.", "by": "코치"}], "notices": ["9월 12일(토) 4주차 오프라인 수업 참석 여부 투표 재안내 — 9월 11일 오후 4시 30분 마감 후 종료", "강사가 정규강의 외에 공장강의와 추가 줌라이브 소통을 이어갈 예정. 쿠팡 로직 변경에 따른 테스트 내용도 정리되면 공유 예정", "채팅방에 주민번호 등 개인정보가 보이는 사진은 올리지 말고 삭제할 것(코치)"], "links": [], "label": "9/11 (금)"}, {"date": "2026-09-10", "summary": "유통전문판매업 온라인 신고 시 수수료 26,200원 외에 등록면허세 27,000원을 따로 내야 한다는 수강생 정보 공유로 하루가 열림 · 운영진의 9/12(토) 오후 3시 4주차 오프라인 참석 여부 투표 안내(마감 9/11 오후 4시 30분) · 건강기능식품 일반판매업과 유통전문판매업 영업신고는 정부24에서 각각 따로 신청하며 첨부는 위생교육 수료증과 OEM 계약서라는 수강생들의 정리 · 구청 방문 시 OEM 제조업체 영업등록증까지 요구받았다는 질문에 지자체마다 필요 서류가 달라 방문 전 위생과에 전화로 확인하고 한 번에 가라는 강사 답 · 4시간 출석 교육은 본인이 직접 가야 한다는 답 · 집 주소로 낸 영업신고가 반려된 수강생에게 비상주 오피스를 알아보라는 안내(추천인 코드는 하니쌤) · 온라인 신청 첨부서류·수수료(지역별 5~11만 원대)·처리 기준이 담당자마다 다르다는 후기가 이어짐 · 물류계약서 끝장에 업체 영업등록증이 붙어 있다는 코치 안내 · OEM 계약서 다운로드 시 감사추적인증서만 내려받아진다는 질문에 제조사 1:1 상담으로 PDF를 받으라는 답 · 쿠팡윙 빠른정산 대상자가 아니라는 질문에 올라 선정산을 먼저 쓰다가 판매내역 발생 후 승인받는다는 답", "qa": [{"q": "건강기능식품 영업신고증과 유통전문판매업 영업신고증은 온라인으로 어떻게 신청하나요? 동시에 되나요?", "a": "둘 다 정부24에서 각각 따로 신청한다. 건강기능식품은 '일반판매업'으로, 식품영업신고는 '유통전문판매업'으로 신청하며, 식품영업신고 발급하기에서 영업 종류를 유통전문판매업으로 고르고 위생교육 수료증과 OEM 계약서를 첨부한다. 식품용수 등 해당 없는 항목은 수돗물·해당없음으로 체크하면 된다.", "by": ""}, {"q": "구청 위생과에서 OEM 계약서와 영업등록증 사본을 가져와야 신고증을 준다는데 어떻게 해야 하나요?", "a": "OEM 계약서는 공지 댓글에 코치가 올린 양식으로 작성해 가져가면 된다. 영업등록증은 어떤 것을 말하는지 위생과에 전화로 확인해야 하며, 지자체마다 필요 서류가 다르므로 방문 전 필요 서류를 확인하고 한 번에 갖춰 가는 것이 좋다. (확인 결과 OEM 제조업체의 영업등록증이었다.)", "by": "강사(하니쌤)"}, {"q": "건강기능식품 영업신고 온라인 신청 시 '건강기능식품 일반판매업'에 체크하면 되나요?", "a": "맞다. 일반판매업으로 체크한다.", "by": "강사(하니쌤)"}, {"q": "가족 명의로 사업을 하려는데 출석해서 듣는 4시간 위생교육은 꼭 당사자가 가야 하나요?", "a": "본인이 직접 가야 한다.", "by": "강사(하니쌤)"}, {"q": "집 주소로 영업신고를 했더니 일반 거주 건축물이라 반려됐는데 사무실을 대여해야 하나요?", "a": "이전에 안내한 비상주 오피스에 연락해 계약하면 된다. 추천인 코드는 '하니쌤'을 입력한다. 다만 지자체에 따라 아파트 주소로 사업자등록·영업신고를 받아준 곳도 있다.", "by": "강사(하니쌤)"}, {"q": "온라인 신청 시 첨부서류는 2시간·4시간 수료증만 내면 되나요?", "a": "담당자마다 기준이 다르다. 수료증만 첨부해 1시간 만에 나온 경우도 있고, 임대차·3PL·OEM 계약서까지 전부 첨부해 통과한 경우도 있다. 서류가 미비하면 담당자가 전화로 알려주니 먼저 넣어 보라는 의견이 많았다.", "by": ""}, {"q": "물류(3PL) 계약 시 업체의 제조·가공 영업등록증 사본은 어디서 받나요?", "a": "물류·OEM 계약서 맨 끝장에 관련 서류가 붙어 있다. 없으면 업체에 문의해 받을 수 있다.", "by": "코치"}, {"q": "OEM 계약서를 작성했는데 다운로드하면 감사추적인증서만 나옵니다. 계약서는 어떻게 받나요?", "a": "제조사(에이브바이오랩스) 1:1 채널 상담으로 문의하면 카톡이나 PDF로 계약서 파일을 빠르게 보내준다.", "by": ""}, {"q": "쿠팡윙에서 셀러월렛 빠른정산 대상자가 아니라고 나오는데 뭐가 잘못됐나요?", "a": "3강 내용대로 우선 올라 선정산을 쓰다가 쿠팡에 판매내역이 생기면 쿠팡 본사 승인 후 가능해진다. 올라 선정산 가입 시 추천인 코드는 하니쌤 코드를 입력한다.", "by": ""}, {"q": "디앤에스로지스 완료 계약서를 열면 글자 위치가 어긋나고 서명이 크게 나오는데 다른 분도 그런가요?", "a": "다른 수강생도 같았다. 예쁘게는 나오지 않는다.", "by": ""}], "notices": ["9월 12일(토) 오후 3시 4주차 오프라인 수업 참석 여부 투표 — 마감 9월 11일(금) 오후 4시 30분. 미참 시 무편집 현장녹화본을 머니업클래스 내강의실에서 수강 가능", "OEM 계약서 양식은 공지글 댓글에 코치가 올려 두었으니 작성해서 위생과에 제출"], "links": [{"label": "에이브바이오랩스 1:1 상담 채널(OEM 계약서 문의)", "url": "https://bobusang.channel.io/home"}], "label": "9/10 (목)"}, {"date": "2026-09-09", "summary": "위탁제품 연습 판매도 이번에 개설한 사업자로 해도 된다는 답 · OEM계약서에 상호 도장은 안 파도 되고 서명만 하면 된다는 답 · 건온연 사이트 가입은 당일 오후 5시 일괄 승인이라는 답 · 수원 위생교육 참석자들의 교통·주차 이야기와 4시간 교육 응원 · 유통전문판매업 신고는 정부24 온라인으로 가능하고 서류는 방문과 동일하며 수수료도 조금 싸다는 수강생 정보 공유 · 정부24 발급 화면이 맞는지 묻자 강사는 온라인 경험이 없다고 했고 수강생이 맞다며 헷갈리는 항목은 관할 위생과에 물어보라는 답 · 집 주소인 경우 건물내부 면적은 집 평수, 외부는 0으로 적고 첨부파일은 수료증란에 모두 넣고 나머지는 해당사항없음으로 하면 된다는 수강생 팁과 온라인 신청 완료 소식", "qa": [{"q": "위탁제품을 연습 삼아 판매할 때 사업자를 따로 안 만들고 이번에 개설한 사업자로 해도 되나요?", "a": "그렇게 해도 된다.", "by": "강사(하니쌤)"}, {"q": "OEM계약서 작성 시 상호명 도장을 파서 찍어야 하나요?", "a": "도장은 따로 안 파도 되고 서명만 하면 된다. 다른 수강생도 대표자 이름으로 서명했다.", "by": "운영진"}, {"q": "건온연 사이트 가입 승인이 바로 안 되는데 1:1 상담을 해야 하나요?", "a": "당일 오후 5시에 일괄 승인 예정이니 5시 이후에 확인하면 된다.", "by": "운영진"}, {"q": "유통전문판매업 신고를 위생과에 직접 안 가고 온라인으로 할 수 있나요? 온라인 서류는 뭐가 필요한가요?", "a": "정부24에서 온라인으로 할 수 있고 수수료도 조금 싸다. 서류는 방문과 동일하고 접수 방식만 다르다. 다만 작성 중 헷갈리는 항목은 관할 지자체 위생과 담당자와 통화하며 진행해야 해서 시간이 있으면 직접 가는 것이 더 나을 수도 있다는 수강생 정보.", "by": ""}, {"q": "정부24 유통전문판매업 영업신고 화면에서 건물 내부·외부 장소 면적과 첨부파일은 어떻게 입력하나요?", "a": "집이 사업장이면 건물내부장소는 집 평수, 건물외부장소는 0으로 기재한다. 필요한 첨부파일은 수료증 첨부란에 전부 첨부하고 나머지는 해당사항없음을 클릭하면 된다는 수강생 팁. 이렇게 방문 없이 신청을 완료한 사례가 있다.", "by": ""}], "notices": [], "links": [], "label": "9/9 (수)"}, {"date": "2026-09-08", "summary": "전날의 사업자등록증 변경 후 OEM계약서 재작성 문의는 제조사 채팅상담으로 안내 · 9월 12일 4주차 오프라인 참석 여부 투표 안내(마감 9월 11일 오후 4시 30분) · 정상가·판매가·할인쿠폰 적용 최종판매가 가격설정 시트가 추가된 마진계산기와 금주 홈쇼핑 편성표 배포 · 건온연 카페 강의 후기 작성 요청 · 원료리포트는 다음 주에 나오며 검색은 안 되고 강사가 전달한다는 답 · 표준계약서 파일에 감사추적인증서만 있다는 문의는 OEM은 에이브바이오랩스 1:1 상담, 물류는 디앤에스로지스 담당자에게 문의하라는 답 · 소싱 감이 안 온다는 고민에 아이템스카우트는 건강식품 카테고리 최소 검색수 5천~1만 이상으로 보고 위클리리포트·아이템스카우트로 원료 선정 후 쿠팡 검증을 반복하라는 답 · OEM·3PL 계약서 링크를 공지에 올려 달라는 요청에 공지사항 댓글에 작성하겠다는 답 · OEM 사이트 관리자 승인은 오후 5시 일괄 처리라는 답", "qa": [{"q": "사업자등록증이 변경돼 OEM계약서를 다시 작성하려는데 기존 인증 중복으로 안 됩니다. 수정 부분만 직접 고쳐 써도 되나요?", "a": "OEM계약서 관련 문의는 제조사 채팅상담으로 문의하면 정확한 안내를 받을 수 있다.", "by": "운영진"}, {"q": "이번 주 원료리포트가 있나요? 수강생이 직접 검색할 수는 없나요?", "a": "원료리포트는 지난주 월요일에 나왔으므로 다음 주에 나올 예정이다. 검색은 안 되고 강사가 전달한다.", "by": "강사(하니쌤)"}, {"q": "표준계약서를 작성했는데 파일에 감사추적인증서만 있습니다. 계약서는 어디에 문의하나요?", "a": "OEM계약서는 에이브바이오랩스 1:1 상담(채널톡), 물류창고 계약서는 디앤에스로지스 담당자에게 문의하면 빠르고 자세히 안내받을 수 있다.", "by": "코치"}, {"q": "위클리리포트·아이템스카우트·쿠팡 판매량 확인을 어떻게 접목해서 소싱해야 할지 감이 안 옵니다.", "a": "아이템스카우트에서 건강식품 카테고리로 볼 때는 최소 검색수 5천~1만 이상으로 본다. 딱 접목시킨다기보다 위클리리포트와 아이템스카우트에서 원료를 선정하고 쿠팡에서 검증하는 과정을 반복하는 것이다. 원료는 정해 놓지 말고 두루두루 많이 찾아볼수록 많이 보인다.", "by": "강사(하니쌤)"}, {"q": "OEM·3PL 계약서 작성 링크와 문의처를 단톡방 공지로 등록해 줄 수 있나요?", "a": "공지사항은 플랫폼 공지와 같이 보여야 하므로 공지사항 댓글에 해당 내용을 작성하겠다. 단톡방 상단 공지사항을 더블클릭 또는 터치하면 아래 댓글에서 확인할 수 있다.", "by": "코치"}, {"q": "OEM 사이트에 가입했는데 관리자 승인은 보통 얼마나 기다리나요?", "a": "오후 5시에 일괄 처리된다. 지금 가입했다면 다음 날 오후 5시경 승인되며, 그때까지 안 되면 말하면 에이브바이오랩스에 확인 요청하겠다.", "by": "운영진"}], "notices": ["9월 12일(토) 오후 3시 4주차 오프라인 수업 참석 여부 투표 — 마감 9월 11일(금) 오후 4시 30분. 미참 시 무편집 현장녹화본 수강 가능", "정상가·판매가·할인쿠폰 적용 후 최종판매가 가격설정 탭이 추가된 마진계산기 파일 재공유(가격설정 시트/기존 마진계산기 시트 분리) 및 금주 홈쇼핑 편성표 배포", "건온연 카페 '강의 후기' 탭에 강의 후기 작성 요청", "원료리포트는 다음 주 배포 예정(강사가 직접 전달)", "OEM·3PL 계약서 링크와 문의처를 단톡방 상단 공지사항 댓글에 등록 예정"], "links": [{"label": "제조사(에이브바이오랩스) OEM 계약서 채팅상담", "url": "https://bobusang.channel.io/workflows/838067"}, {"label": "에이브바이오랩스 1:1 상담 채널톡", "url": "https://bobusang.channel.io/home"}], "label": "9/8 (화)"}, {"date": "2026-09-07", "summary": "위생과에서 영업신고 시 OEM계약서와 3PL 물류대행계약서도 요구한다며 모두싸인 계약서 다운로드처를 묻자 메일을 확인하고 없으면 제조사 채널톡에 문의하라는 답, zip 파일을 압축 해제하면 계약서 PDF가 있다는 수강생 팁 · 3주차 강의 당일 업로드 확인 후 오후 3시 17분 업로드 안내(내 강의실, 강의자료는 1교시 영상 하단) · 사업자등록증 변경 후 OEM계약서 재작성이 중복 인증으로 막힌다는 질문은 답변 대기 · 3PL 물류계약서 계약일자는 편한 대로 적으면 된다는 수강생 답", "qa": [{"q": "위생과에서 OEM계약서와 3PL 물류대행계약서도 필요하다는데 모두싸인으로 계약한 서류는 어디서 다운로드하나요?", "a": "먼저 메일로 전달됐는지 확인하고, 없으면 제조사 빠른 상담 지원 채널톡으로 문의하면 된다. 수강생 팁으로 받은 zip 파일을 열기만 하지 말고 압축을 풀면 안에 계약서 PDF가 있다.", "by": "운영진"}, {"q": "3주차 생 공유 · 3PL 계약일자는 물류 대표에게 문의하면 된다는 답 · 마진계산기에 부가세는 포함, 종소세는 별도 계산이라는 코치 답과 원가·배송비·판매FEE 입력 기준 상세 설명 · 수강생이 배송비 부가세 수식 오류를 짚어 코치가 인정하고 배송비는 부가세 포함 금액으로 적으라고 정정 · OEM계약서 개인사업자는 사업자번호 또는 주민번호 중 하나만 적고 법인등록번호는 하이픈 표시라는 답 · 제조승인요청 유입경로는 하니쌤으로 표기하라는 답 · 정수별 최소수량 표는 라벨·단상자 목업 디자인 무료 지원 기준이며 60정은 1000mg으로 1000개 제조 시 지원된다는 답", "qa": [{"q": "구청에서 영업신고를 하면 영업신고증 외에 건강기능식품 영업신고증도 같이 발급해 주나요?", "a": "온라인·오프라인 교육을 수료하고 수료증을 가져가면 건강기능식품영업신고증과 유통전문판매업 영업신고증 두 개를 발급받는다는 수강생 답.", "by": ""}, {"q": "영업신고증을 정부24에서도 발급받을 수 있나요?", "a": "강사는 방문만 해 봤다고 했고, 수강생이 관할 지자체 위생과에서 온라인 신고가 가능하다는 답변을 받았다고 공유했다. 온라인 제출 후 12,000원 입금하고 4일 만에 받았다는 사례는 통신판매업 신고증이었다.", "by": ""}, {"q": "3PL 계약일자는 누구에게 문의하나요?", "a": "디엔에스로지스 대표에게 문의하면 된다.", "by": "강사(하니쌤)"}, {"q": "마진계산기에 부가세는 포함돼 있는데 종소세도 계산해야 하나요?", "a": "품목당 부가세는 포함돼 있다. 종합소득세는 추후 매입·매출을 보고 따로 계산해야 한다.", "by": "코치"}, {"q": "마진계산기의 원가·배송비·판매FEE는 어떤 기준으로 입력하나요?", "a": "원가는 제조사 견적서의 부가세 포함 금액을 수량으로 나눈 개당 금액(예: 1,000개에 100만 원이면 1,000원). 배송비는 부가세 포함 금액을 적는다. 판매FEE는 부가세 전 요율(약 10%)을 적으면 수식에서 1.1을 곱해 부가세 포함으로 마진에서 제외된다. 판매가에 1.1을 곱하지는 않는다.", "by": "코치"}, {"q": "마진 수식이 배송비는 부가세 전으로 빼고 있는데 =E4-C4-(D4*1.1)-(F4*E4*1.1)처럼 배송비도 부가세 포함으로 빼야 하지 않나요?", "a": "수강생 지적이 맞다고 코치가 인정했다. 다른 버전의 계산기와 섞여 수식이 달라진 것으로, 안내 문구를 수정하겠다고 했고 배송비 칸에는 부가세 포함 금액을 적으면 된다.", "by": "코치"}, {"q": "OEM계약서에서 개인사업자는 사업자등록번호(주민번호)란과 법인등록번호란에 무엇을 적나요?", "a": "개인사업자는 사업자등록번호 또는 주민등록번호 중 하나만 편한 대로 입력하고, 법인등록번호란은 발급되지 않으므로 하이픈(-)만 표시한다. 법인이면 두 번호를 모두 입력한다.", "by": "운영진"}, {"q": "에이브바이오랩스 제조승인요청 플랫폼에서 승인요청 유입경로는 뭐라고 적나요?", "a": "하니쌤으로 표기하면 된다.", "by": "코치"}, {"q": "2주차 정수별 최소수량 표대로라면 60정으로 1,000개 제조는 못 하나요?", "a": "그 표는 라벨·단상자 목업 디자인을 무료 지원받을 수 있는 최소 수량이고, 그 이하도 디자인 지원 없이 제조는 가능하다. 60정은 1000mg으로 1,000개 하면 지원받을 수 있다.", "by": "강사(하니쌤)"}], "notices": ["9월 5일(토) 오후 3시 3주차 오프라인 수업 참석 여부 투표 재안내 — 마감 9월 4일(금) 오후 4시 30분", "마진계산기 배송비 입력 기준 정정 — 배송비 칸에는 부가세 포함 금액을 적을 것, 안내 문구 수정 예정"], "links": [], "label": "9/3 (목)"}, {"date": "2026-09-02", "summary": "3주차 오프라인 참석 여부 투표 재안내 · 통신판매업 신고증의 인터넷 도메인을 쿠팡으로 적었더니 시청에서 네이버로 하라며 두 번 반려됐다는 질문에 쿠팡도 통과된 사례가 있고 크게 상관없으니 시청이 요구하는 대로 네이버(스마트스토어 도메인)로 해 보라는 답", "qa": [{"q": "통신판매업 신고증의 인터넷 도메인 이름을 쿠팡으로 적었는데 시청에서 네이버로 하라고 반려합니다. 어떻게 해야 하나요?", "a": "강사도 쿠팡으로 적었고 다른 수강생은 쿠팡으로 통과된 사례도 있어 크게 상관없는 항목이다. 시청에서 네이버로 하라고 했으면 그냥 네이버(스마트스토어 도메인)로 적어서 진행하면 된다.", "by": "강사(하니쌤)"}], "notices": ["9월 5일(토) 오후 3시 3주차 오프라인 수업 참석 여부 투표 재안내 — 마감 9월 4일(금) 오후 4시 30분"], "links": [], "label": "9/2 (수)"}, {"date": "2026-09-01", "summary": "쿠팡 입점이 내부심사기준으로 거부된 수강생에게 이메일로 사유를 받아보라는 답 · 사업자등록증은 홈택스에서 사업자 로그인으로 전환해 발급받는다는 답 · 9월 5일 3주차 오프라인 참석 여부 투표 안내(마감 9월 4일 오후 4시 30분) · 9월 29일 공장견학 오전반 10시 확정, 오전/오후반 투표는 4강 종료 후 진행 예고 · 강의자료는 1강·2-1강 영상 하단에서 다운로드한다는 답 · 에이브바이오랩스 OEM계약서·제조승인요청서·건온연B2B 도매승인·이용가이드·3PL 물류계약 링크 일괄 안내 · 기존 일반사업자는 간이 추가 발급이 안 되니 일반으로 내도 괜찮다는 답 · OEM계약서는 제조 진행 시 필요한 서류라 서류 준비 후 작성해도 되고 미리 작성해 두면 구청 제출이 수월하다는 답 · 계약서 입력란 문의는 제조사 확인 중이고 물류 관련은 3PL 대표에게 문의 안내 · 도매승인요청서 대표자명 불일치 문의는 제조사 상담 채널 안내 · 유통전문판매업 신고는 정부24로도 가능하다는 수강생 정보 공유", "qa": [{"q": "쿠팡 판매자 입점이 내부심사기준으로 거부됐는데 어떻게 해야 하나요?", "a": "콜센터는 자동응답만 돌아가니 이메일로 거부 사유를 전달받아 보는 것이 좋다.", "by": "강사(하니쌤)"}, {"q": "사업자등록증은 어디서 발급(다운로드)받나요?", "a": "홈택스에서 발급받는다. 개인 간편인증으로 로그인하면 안 보이고 사업자로 전환해서 들어가면 나의 민원 처리현황에서 확인·다운로드할 수 있다.", "by": "강사(하니쌤)"}, {"q": "9월 29일 공장견학 오전반 10시가 확정인가요? 오전/오후반 투표는 언제 하나요?", "a": "오전반 10시 확정이 맞다. 오전/오후반 투표는 4강 정규강의 종료 이후 진행 예정이다.", "by": "강사(하니쌤)"}, {"q": "강의자료는 어디서 다운로드하나요?", "a": "1강 자료는 첫 강의 영상 하단, 2강 자료는 2-1강 영상 하단에서 다운로드할 수 있다.", "by": "강사(하니쌤)"}, {"q": "기존에 일반사업자가 있어서 간이사업자 추가 발급이 안 된다는데 일반으로 내도 되나요?", "a": "기존에 일반사업자가 있으면 간이는 안 되므로 일반사업자로 내면 되고, 그렇게 해도 괜찮다.", "by": "강사(하니쌤)"}, {"q": "OEM계약서는 지금 작성해서 보내야 하나요, 이미 작성한 경우는 괜찮나요?", "a": "제조 진행 시 필요한 계약서라 필수 서류를 준비한 뒤 추후 작성해도 되고, 미리 작성해 둬도 된다. 제조 시 유통전문판매 수료증과 함께 구청에 계약서를 제출해야 하므로 미리 준비하면 수월하다.", "by": "운영진"}, {"q": "건온연B2B 도매승인요청서의 대표자명과 사업자등록증상 대표 명의가 달라도 되나요?", "a": "제조사 상담지원 채널(채널톡) 링크로 문의하면 빠르게 안내받을 수 있다.", "by": "운영진"}, {"q": "유통전문판매업 신고는 직접 방문해야 하나요?", "a": "오프라인 4시간 교육 후 정부24를 통해서도 신고할 수 있다는 수강생 정보 공유.", "by": ""}], "notices": ["9월 5 저녁에는 통신판매업 신청이 안 넘어가는 문제에 구매안전서비스 이용확인증만 첨부하라는 수강생 조언과 쿠팡윙 고객확인제도 등록하기가 안 보이면 서류가 다 제출된 것이니 승인만 기다리면 된다는 답 · 상호명이 스마트스토어에 이미 있어도 사업자는 번호로 구분되니 브랜드 존재 여부만 보면 된다는 답 · 현금영수증 가맹점 가입 여부와 브랜드명을 어디에 적는지는 답변 대기", "qa": [{"q": "유통전문판매업 집합교육은 어느 날짜로 신청해야 하고, 신청서의 업체 정보는 누구 것을 쓰나요?", "a": "일정은 본인 상황에 맞는 날로 아무 때나 신청하면 됩니다. 신청서에는 업체명을 포함해 수강생 본인의 사업자 정보를 입력하며, 교육 종류는 유통전문판매업 4시간이 맞습니다.", "by": "코치"}, {"q": "스마트스토어 가입 시 통신판매업 신고번호(연도-지역-4자리)와 업종은 어떻게 입력하나요?", "a": "신고번호는 통신판매업신고증에 있고, 아직 신고 전이면 통신판매업 미신고로 진행하면 넘어갑니다. 업종은 전자상거래 소매업이 맞습니다.", "by": "코치"}, {"q": "스마트스토어 이름, URL, 소개글은 무엇을 적나요?", "a": "온라인 상점이 생기는 것이므로 브랜드명이든 사업자명이든 자유롭게 정하면 되고 나중에 수정도 됩니다. URL은 보통 브랜드명을 영문으로 그대로 쓰고, 소개글은 상호 소개 한 줄 정도면 충분합니다.", "by": "강사(하니쌤)"}, {"q": "이미 온라인판매 사업자가 있는데 건강식품을 팔려면 사업자를 새로 내야 하나요?", "a": "기존 사업자로 건강식품도 판매할 수 있고, 기존 제품과 분리하고 싶을 때만 하나 더 내면 됩니다. 기존 사업자로 하면 온·오프라인 교육 두 가지를 수료한 뒤 영업신고증 두 가지만 발급받으면 되고, 비상주 오피스 주소를 새로 받거나 토스페이먼츠로 사업자를 다시 등록할 필요가 없습니다. 작년에 받아 둔 통신판매업신고증과 구매안전서비스 이용확인증도 그대로 씁니다.", "by": "강사(하니쌤)"}, {"q": "1강 내용을 다 마친 상태는 어디까지인가요?", "a": "사업자등록, 통신판매업 신고, 구매안전이용서비스 확인증, 두 가지 교육 수료와 수료증 발급, 지자체 위생과 방문해서 영업신고증 2가지 발급까지 하면 1강 내용은 마무리된 것입니다.", "by": "강사(하니쌤)"}, {"q": "OEM 제조비용(1,000개)은 할부가 되나요? 위탁계약서와 제조업소 영업등록증은 어떻게 받나요?", "a": "기본은 현금 선납이지만 카드결제를 하면 할부가 된다고 합니다. 계약서는 이전 공지의 링크로 발급받을 수 있고 영업등록증은 제조사에 문의하면 받을 수 있으며, 자세한 비용 문의는 제조사 1:1 문의 링크를 이용합니다.", "by": "강사(하니쌤)"}, {"q": "크랜베리 농축액이나 1포씩 된 레몬즙 같은 즙·농축액 형태도 건강식품인가요?", "a": "제품을 정확히 봐야 하지만 원료명으로 보면 건강식품으로 예상되고, 실제 제품 사진을 보니 건강식품으로 보인다는 답이었습니다.", "by": "코치"}, {"q": "쿠팡 가입 시 비즈니스 형태와 대표 카테고리는 무엇을 고르나요?", "a": "브랜드오너 제조사를 선택하고 대표 카테고리는 식품으로 합니다.", "by": "강사(하니쌤)"}, {"q": "가족 명의로 사업자를 내면 오프라인 위생교육도 가족이 가야 하나요?", "a": "대리인 참석이 가능하지만 대리인은 직원이어야 하므로 1인 사업자라면 대표자가 직접 참석해야 합니다.", "by": "코치"}, {"q": "쿠팡윙에서 고객확인제도 등록하기가 안 보이는데 어떻게 하나요?", "a": "제출 서류를 다 냈으면 그 항목이 안 보이는 것이 정상이고 안 뜨면 안 해도 됩니다. 심사가 끝나면 정상 판매 가능한 계정으로 승인되니 조금만 기다리면 되고, 계정마다 화면이 조금씩 달라 전체 틀을 이해하는 개념으로 보면 됩니다.", "by": "강사(하니쌤)"}, {"q": "법인 사업자의 주소를 비상주 오피스로 바꾸려면 어떻게 하나요?", "a": "먼저 법인등기부등본의 본점 소재지를 변경해야 하고, 같은 등기소 관할인지 다른 관할인지에 따라 절차가 다릅니다. 비상주 오피스로 본점 등기가 가능한지 계약 전에 확인해야 하고, 통신판매업 등 별도 신고도 각각 주소를 변경해야 합니다. 보통 세무사와 연계된 법무사에게 맡기는 일입니다.", "by": "강사(하니쌤)"}, {"q": "사업자등록 때 확인한 상호명이 스마트스토어에서 이미 사용 중이라고 나오면 사업자를 정정해야 하나요?", "a": "사업자는 명칭이 아닌 사업자번호로 구분되므로 정정할 필요가 없고, 브랜드가 이미 있는지가 중요합니다. 스마트스토어에는 브랜드명을 적지 않아도 됩니다.", "by": "강사(하니쌤)"}], "notices": ["8/29(토) 오후 3시 2주차 오프라인 수업 참석 여부 투표 — 마감 8/28(금) 오후 4시 30분. 미참석해도 무편집 현장녹화본을 내강의실에서 수강 가능", "대면등록 전자세금계산서 발행 등 결제 관련 문의는 머니업클래스 1:1 문의로"], "links": [{"label": "머니업클래스 카카오톡 채널 1:1 문의", "url": "http://pf.kakao.com/_mxffBn/chat"}, {"label": "제조사(보부상) 1:1 문의 — OEM 계약서·제조비용 문의", "url": "https://bobusang.channel.io/home"}], "label": "8/27 (목)"}, {"date": "2026-08-26", "summary": "쿠팡 빠른정산이 사업자당 한 계정만 된다는 수강생 확인과 정산 방식 고민으로 하루 시작 · 8월 29일(토) 오후 3시 2주차 오프라인 수업 참석 투표 안내(마감 8월 28일 금 오후 4시 30분) · 여건 되면 월정산이 가장 깔끔하고 자본금이 없으면 빠른정산, 빠른정산 중이면 정산유형 변경 화면이 안 뜬다는 강사 답 · 통신판매업 신고와 현금영수증가맹점 가입은 필수이고 키프리스에 브랜드명이 겹치면 사업자는 그대로 두고 브랜드명만 바꾸면 된다는 답 · 간이·일반과세 기준(직전연도 매출 1억 400만 원)과 개인사업자로 등록한다는 코치 답 · 강의 시청·자료 다운로드 방법 안내 · 브랜드명 한글·영문 표기는 선택이고 기획 단계에서 정하며 상표등록은 판매가 잘된 뒤 해도 늦지 않다는 코치 답 · 공장견학은 9월 29일(화) 전북 익산, 오전반 10~14시·오후반 15~19시로 나눈다는 예고와 주말 진행은 제조사·3PL 휴무라 불가하다는 답 · 위생교육은 대리인 참석 가능하고 수원 교육은 오늘부터 신청 가능하다는 소식 · 구매안전서비스 이용확인증 버튼이 안 보이면 개인 판매자를 사업자로 전환하라는 답 · 토스페이먼츠 PG 계약은 필수가 아니고 스마트스토어 정산계좌는 다른 통장도 된다는 답 · 통신판매업 신고는 홈택스가 아닌 정부24에서 하고 네이버 가입(구매안전서비스 이용확인증)이 먼저이며 도메인에 쿠팡을 적어도 된다는 답 · 초보 수강생 중 월 300 순이익 비율과 신용카드 가맹점 가입 여부는 답변 대기 · 오프라인 강의 장소(선릉역 인텔빌딩 10층) 안내", "qa": [{"q": "쿠팡 정산은 빠른정산·주정산·월정산 중 무엇을 고르고, 정산유형은 어디서 바꾸나요?", "a": "여건이 되면 월정산이 한 달치가 한눈에 보여 가장 깔끔하지만, 이번 달 정산을 다음 달 말에 주므로 월초 판매분은 약 두 달이 묶인다. 자본금이 적으면 빠른정산을 쓰라고 안내한 것이고, 강사도 공산품 계정 하나에서만 빠른정산을 쓴다(빠른정산은 사업자당 한 계정). 변경은 판매자정보 → 추가판매자정보 → 정산정보 → 정산유형에서 하며, 빠른정산 사용 중이면 무조건 주정산이라 변경 화면이 안 뜬다. 주정산에서 월정산으로 바꾸면 다음 달 1일부터 적용된다.", "by": "강사(하니쌤)"}, {"q": "통신판매업 신고와 현금영수증가맹점 가입은 꼭 해야 하나요?", "a": "통신판매업 신고는 필수다. 국세청에서 오는 현금영수증가맹점 가입 안내도 어차피 나중에 해야 하는 것이라 서류 처리하는 김에 해두는 것이 좋다.", "by": "강사(하니쌤)"}, {"q": "통신판매업 신고는 어디서, 어떤 순서로, 서식은 어떻게 적나요?", "a": "홈택스가 아니라 정부24에서 한다. PPT 77장 순서대로 4번 네이버 스마트스토어 가입을 먼저 해야 구매안전서비스 이용확인증이 나오고, 그것으로 5번 통신판매업 신고증을 받는다. 도메인은 스마트스토어 주소만 되는 것이 아니라 쿠팡에서 팔 예정이면 쿠팡이라고 적어도 되며, 판매방식 인터넷 / 도메인 쿠팡 / 취급품목 식품 / 구체적 품목 건강식품 정도로 적으면 된다. 신고 수수료를 납부해야 신고증이 나온다.", "by": "강사(하니쌤)"}, {"q": "스마트스토어센터에서 구매안전서비스 이용확인증 버튼이 안 보여요.", "a": "PC에서 스마트스토어센터 → 판매자정보 → 판매자 관리 → 판매자 정보 우측 상단에 표시된다. 안 보이면 국내 개인 판매자로 가입한 경우이므로 판매자정보 → 사업자 전환에서 사업자등록증 정보로 전환 신청하면 된다. 전환 심사 중에도 확인증이 바로 보였다는 수강생 사례도 있었다. 통신판매업 신고 전이면 스마트스토어 가입 시 통신판매업 미신고로 두고 진행한다.", "by": "강사(하니쌤)"}, {"q": "토스페이먼츠로 사업자등록을 신청했는데 통장정보·신분증·전자서명 화면이 안 나오고, 사업자등록증에 업종코드도 없어요. 잘못된 건가요?", "a": "토스페이먼츠의 사업자등록 신청과 PG(전자결제) 계약은 별개라서, 사업자등록증이 정상 발급됐으면 등록은 끝난 것이다. 쿠팡·스마트스토어에 입점해 파는 것이므로 PG 계약은 필수가 아니다. 사업자등록증에는 업종코드(525101)가 표시되지 않고 업태 도매 및 소매업 / 종목 전자상거래 소매업으로 나오면 정상이다. 상호명까지만 입력했는데 신청됐다는 카톡을 받았다면 접수된 것이니 다음 날 신청 내역을 확인하면 된다.", "by": "강사(하니쌤)"}, {"q": "사업자를 낸 뒤 보니 브랜드명이 키프리스에 이미 있어요. 사업자를 다시 내야 하나요?", "a": "사업자는 상관없고 브랜드명만 다시 정하면 된다. 한글만 다른데 앞에 영문이 붙은 유사 상표가 검색된 경우도, 리스크를 줄이려면 바꾸는 편이 낫다는 코치 의견이었다.", "by": "강사(하니쌤)"}, {"q": "상표등록은 지금 해야 하나요? 브랜드가 여러 개면 비용이 많이 들지 않나요?", "a": "우선 키프리스에서 겹치지 않는 브랜드명으로 진행하고, 상표권·세금·아이템위너 같은 문제는 판매가 잘된 뒤에 고민해도 늦지 않다. 다만 브랜드명에 애착이 있으면 예방 차원에서 미리 해도 되고 변리사도 소개해 준다. 제품별로 브랜드를 나누는 곳도, 원료 하나를 4~5개 브랜드로 나누는 곳도 있으며 그 정도면 상표 비용은 미미하다.", "by": "코치"}, {"q": "브랜드명은 한글로 쓰나요 영문으로 쓰나요? 제품 나올 때 정하면 되나요?", "a": "표기는 선택이다(오리온·고려은단은 한글, Nike는 영문, 락토핏은 둘 다). 브랜드명은 제품이 나오기 전 기획 단계에서 정해야 한다.", "by": "코치"}, {"q": "위생과에 영업신고 하러 갈 때 건기식이 아니라 일반가공식품이라고 말하라는 게 무슨 뜻인가요? 필요 서류와 교육 접수증은요?", "a": "우리는 건강기능식품이 아니라 일반가공식품을 OEM으로 제조해 내 브랜드로 파는 유통전문판매업이다. 교육 수료증을 내면 알아서 발급해 주며, 사무실 도면 등 서류는 방문 전 위생과에 문의한다. 교육 접수증은 카톡 바코드만 확인했지만 혹시 모르니 출력해 가는 것을 권하고, 교육은 대리인이 가도 된다.", "by": "강사(하니쌤)"}, {"q": "간이과세자와 일반과세자는 무엇이 다르고, 개인사업자로 내는 게 맞나요?", "a": "직전연도 매출 1억 400만 원 미만이면 간이, 이상이면 일반과세자다. 간이는 부가세 환급이 안 되고 일반은 매입세액이 많으면 환급된다. 세금은 번 만큼 내는 것이라 이윤이 크게 줄지는 않는다. 기존 사업자가 있어 간이가 안 되면 일반으로 하고, 법인이 아닌 개인사업자로 등록한다.", "by": "코치"}, {"q": "로켓그로스 상품도 아이템위너로 묶일 수 있나요?", "a": "공산품은 묶일 수 있지만 직접 제조한 내 브랜드 건강식품은 묶이지 않는다. 잘 팔려서 악의적 리셀이 생기면 푸는 방법도 알려 준다.", "by": "코치"}, {"q": "세무서에서 개업일을 뭐라고 적나요? 토스페이먼츠에 넣은 계좌와 스마트스토어 정산계좌가 달라도 되나요?", "a": "아직 판매 전이면 사업 시작 예정일로, 특별한 사유가 없으면 오늘이나 가까운 날짜로 적으면 된다. 스마트스토어 정산계좌는 판매대금을 받을 계좌이므로 토스페이먼츠 신청 때 계좌와 같을 필요가 없다.", "by": "강사(하니쌤)"}], "notices": ["8월 29일(토) 오후 3시 2주차 오프라인 수업 참석 여부 투표 진행, 마감 8월 28일(금) 오후 4시 30분. 미참 시 무편집 현장 녹화본을 머니업클래스 내 강의실에서 수강 가능", "수강생 명단에서 확인되지 않는 프로필은 퇴장 조치 예정. 카카오 프로필을 '이름/휴대폰번호 뒤 4자리' 형식으로 설정할 것", "강의 시청은 머니업클래스 내 강의실, 강의 자료는 각 강의 1교시 영상 하단에서 다운로드. 강의 내용 질문은 톡방, 수강·사이트 이용 문의는 머니업클래스 채널로", "공장견학(익산 제조사·3PL) 9월 29일(화) 확정, 오전반 10시~14시 / 오후반 15시~19시로 나누어 참석 투표 예정. 주말 진행은 제조사·3PL 휴무라 불가하니 연차를 미리 확보할 것", "키워드리포트 자료는 2주차 강의가 끝난 뒤 공유 예정", "오프라인 강의 장소는 서울 강남구 대치동 891-40 인텔빌딩 10층 2호(선릉역 근처), 오후 3시 시작이므로 2시 50분까지 도착. 준비물 노트북·충전기·마우스·필기구. 투표를 못 했어도 참석 가능"], "links": [{"label": "카카오톡 프로필 설정 방법 안내(노션)", "url": "https://foul-sousaphone-367.notion.site/26943e0bd866803fadebdaf8f6c60492"}, {"label": "머니업클래스 사이트(내 강의실)", "url": "https://www.moneyupclass.com/"}, {"label": "강의 시청 방법 안내", "url": "https://buly.kr/CqTRkj"}, {"label": "머니업클래스 카카오 채널(수강·사이트 문의)", "url": "https://pf.kakao.com/_mxffBn"}, {"label": "오프라인 강의 장소 오시는 길", "url": "https://m.site.naver.com/1Iafb"}], "label": "8/26 (수)"}, {"date": "2026-08-25", "summary": "예전 개인판매자로 가입한 스마트스토어에 구매안전서비스 이용확인증 버튼이 없다는 질문에 판매자정보에서 사업자 전환 신청만 하면 버튼이 생긴다는 답 · 운영진의 2주차 오프라인(8/29 토 오후 3시) 참석 여부 투표 안내(마감 8/28 금 4시 30분) · 사업자 등록엔 자가든 비상주든 주소가 필요하고 전세면 계약서 제출, 상호명은 중복돼도 되며 사업자명은 브랜드명과 같아도 달라도 상관없다는 답 · 업태는 도소매업, 종목은 전자상거래업 · 공산품 계정에서 건기식을 같이 팔면 쿠팡에서 분리 분석이 안 되니 건식 비중을 키울 거면 사업자 분리를 권장하고, 한 사업자당 주소 하나라 비상주오피스나 가족 명의 집으로 내며 2시간 온라인 교육은 사업자별로 각각 들어야 한다는 답 · 비상주 주소로 유통전문판매업 영업신고가 가능한지 업체에 묻는 방법과 신고증은 본인이 직접 관할 위생과에 방문해야 하니 거주지 가까운 곳을 고르라는 답 · 쿠팡 빠른정산(셀러월렛)은 최근 신규 셀러에게 바로 열리지 않고 판매이력을 본 뒤 선정되니 개인계좌나 카카오뱅크 사업자계좌로 먼저 시작하라는 공지 · 스마트스토어 출고지·반품지는 3PL(디엔에스로지스) 주소로 하고 스토어명은 사업자명과 달라도 된다는 답 · 사업자등록증 빨리 받는 법과 토스페이먼츠 신청 내역 홈택스 확인 등 수강생 간 팁 공유 · 9/4 방배 오프라인 교육 동행 모집과 서로 응원 · 2023년에 만든 사업자는 그대로 쓰되 교육은 다시 들어야 하고, 세금 혜택을 위한 경기도 주소는 신고증 발급 때 한 번만 방문하면 되니 가까운 경기도라면 추천한다는 답 · 원본대조필 사본 제출·브랜드명 제품 표기·쇼핑쇼츠 쿠팡 연결 질문은 답변 대기", "qa": [{"q": "6년 전 서브 ID로 가입한 스마트스토어에 구매안전서비스 이용확인증 출력 버튼이 없어요.", "a": "예전 계정이 '개인 판매자' 유형이면 버튼이 안 보입니다. 서브 ID로 스마트스토어센터에 로그인해 판매자정보 → 판매자 정보변경 → 사업자 전환에서 현재 사업자등록번호로 전환 신청(통신판매업 신고 여부는 '미신고' 선택)하면, 심사가 끝나기 전이라도 판매자정보 → 판매자 관리 → 판매자 정보 상단에 확인증 버튼이 생겨 출력할 수 있습니다. 사업자등록증·통장 사본 등 서류는 이후 전환 심사 과정에서 제출.", "by": "강사(하니쌤)"}, {"q": "사업자등록 신청은 자택이든 비상주오피스든 사업장 주소가 꼭 있어야 하나요? 전세 세입자는요?", "a": "사업장 주소지가 꼭 필요하며 자가로 해도 되고 비상주오피스로 해도 됩니다. 전세라면 계약서를 제출하면 됩니다.", "by": "강사(하니쌤)"}, {"q": "상호명도 상표권처럼 중복 확인이 필요한가요? 사업자명과 브랜드명을 같게 해도 되나요?", "a": "사업자는 상호가 아니라 사업자번호로 구분되므로 동일한 상호여도 등록 가능하고 확인 절차가 없습니다. 사업자명과 브랜드명은 같아도 달라도 상관없지만, 사업자명을 브랜드명으로 쓸 거라면 꼭 키프리스에서 상표권 검색을 하고 브랜드명은 상표권 없는 이름으로 정합니다.", "by": "강사(하니쌤)"}, {"q": "사업자 업태·종목은 뭐라고 적나요? 비상주오피스 신청서의 업태·특수업종 항목은요?", "a": "업태는 도소매업, 종목은 전자상거래업으로 적으면 됩니다.", "by": "강사(하니쌤)·코치"}, {"q": "스마트스토어 정보 입력란의 스토어명·URL·소개글은 뭘로 쓰나요? 사업자명과 달라도 되나요?", "a": "브랜드명이든 사업자명이든 상관없이 대표님이 운영할 스토어명으로 쓰면 되고, 사업자명과 달라도 됩니다. 필수로 입력하라고 안내된 항목(스토어 주소 등)은 입력해야 합니다.", "by": "강사(하니쌤)"}, {"q": "사업자 하나로 기존 공산품 쿠팡 계정에서 건강식품도 같이 팔면 성과를 나눠 볼 수 있나요? 같은 자택 주소로 사업자를 2개 낼 수 있나요?", "a": "쿠팡에서 건기식과 공산품을 나눌 수 없어 옵션별로 판매·광고 성과를 따로 분석해야 합니다. 건식 SKU를 계속 늘릴 계획이면 잡상인처럼 보여 소비자 신뢰가 떨어질 수 있어 새 사업자로 분리를 권장하고, 부담되면 볼륨이 커진 뒤 분리해도 됩니다. 한 사업자당 주소 하나라 비상주오피스나 가족 명의 집으로 내야 하며, 2시간 온라인 일반판매업 교육은 사업자별로 각각 들어야 합니다. 공산품은 그로스 입고 전이면 삭제, 입고했다면 빼고 품절 처리.", "by": "강사(하니쌤)·코치"}, {"q": "비상주오피스 주소로 영업신고가 되는지 어떻게 확인하나요? 시에서 식품은 불가라는데요. 거주지 가까운 곳을 권하는 이유와 대리인 방문 가능 여부는요?", "a": "사업자등록 자체는 '전자상거래 도소매업'이라 비상주 사용이 가능한 곳이 많지만, 위탁제조 브랜드 판매는 별도로 '유통전문판매업' 영업신고가 필요합니다. 비상주 업체에 '식품 제조업이 아니라 제조는 외부 제조업체가 하고 온라인 판매만 하는데 이 주소로 유통전문판매업 영업신고가 가능한가'라고 다시 묻고, 불가하면 다른 비상주 주소를 구합니다. 비상주어때에서 받은 주소는 등록이 안 된 적이 없었음. 신고증은 해당 지자체 위생과에 본인이 신분증을 들고 직접 가야 하고 대리인은 안 되므로 거주지 가까운 곳을 권장하며, 멀다고 반려되지는 않습니다.", "by": "강사(하니쌤)·코치"}, {"q": "쿠팡 빠른정산(셀러월렛)은 바로 신청되나요? 기존 공산품 계정의 빠른정산 계좌를 새 사업자에 쓸 수 있나요?", "a": "예전엔 신규 셀러도 바로 이용 가능했지만 최근엔 판매이력(보통 3개월, 실적에 따라 더 빨리)을 보고 대상자를 선정하므로 개인계좌나 카카오뱅크 사업자계좌로 먼저 시작하는 게 맞습니다. 상담원마다 안내가 달라 바로 되는 경우도 있음. 빠른정산은 쿠팡 계정당이라 새 사업자에는 기존 계좌를 못 쓸 것.", "by": "강사(하니쌤)"}, {"q": "스마트스토어 출고지와 반품교환지 주소는 어디로 하나요?", "a": "실주문이 들어올 수 있으니 3PL 주소로 해 두는 게 편합니다. 반품교환지도 동일하게. 3PL은 (주)디엔에스로지스, 전북 익산시 함열읍 흘산로 303-8(수강생 공유).", "by": "강사(하니쌤)"}, {"q": "2023년에 만들어 둔 전자상거래 소매업 사업자와 건기식 교육수료증·구매안전서비스 이용확인증·통신판매업신고증을 그대로 써도 되나요?", "a": "사업자는 그대로 써도 되지만 온라인 2시간 교육과 오프라인 4시간 교육은 다시 들어야 합니다.", "by": "강사(하니쌤)"}, {"q": "서울 과밀억제권역이라 세금 혜택을 위해 경기도로 사업자 주소를 내는 게 좋을까요? 내년 2월 김포로 이사 예정이에요.", "a": "신고증 발급 때 한 번만 방문하면 되므로 가까운 경기도라면 경기도로 받을 것 같습니다. 내년 2월이면 금방이라 김포로 받아도 되지만 김포 위생과가 까다롭다는 얘기가 있음.", "by": "강사(하니쌤)"}, {"q": "(수강생 간 공유) 통신판매업 신고 시점, 스마트스토어 가입 조건, 사업자등록증 빨리 받는 법, 토스페이먼츠 접수 확인, 온라인 위생교육 조건은요?", "a": "통신판매업 신고와 스마트스토어 가입은 사업자등록증이 나온 뒤에. 홈택스에서 접수증을 출력하면 담당 세무서 직원 이름·번호가 있어 전화로 빠른 처리를 부탁하면 당일 발급되기도 함. 토스페이먼츠로 신청해도 홈택스 신청내역에서 확인 가능. 온라인 위생교육은 사업자 없이도 수강 가능.", "by": ""}], "notices": ["2주차 오프라인 수업 8/29(토) 오후 3시 — 톡게시판 투표로 참석 여부 제출, 마감 8/28(금) 오후 4시 30분. 미참해도 무편집 현장녹화본을 내 강의실에서 수강 가능", "쿠팡 빠른정산(셀러월렛)은 최근 판매이력 확인 후 대상자 선정으로 바뀌어 신규 셀러는 바로 안 될 수 있음 — 개인계좌나 카카오뱅크 사업자계좌로 먼저 시작", "스마트스토어 출고지·반품교환지는 3PL(디엔에스로지스) 주소로 설정"], "links": [], "label": "8/25 (화)"}, {"date": "2026-08-24", "summary": "제조 지원 코치 소개와 에이브바이오랩스 제조 안내문(OEM 계약서·제조승인요청서·제조 의뢰, 건온연B2B 도매 승인 오전 9시·1시·5시 일괄, 3PL 디엔에스로지스 계약) 공유 · 완강 후 제조하려면 제조업을 추가해야 하냐는 질문에 위탁제조라 불필요하다는 답 · 운영진의 1주차 정규강의 업로드 안내(내 강의실, 강의자료는 1교시 영상 하단)와 1교시 일부 초점 흐림 양해 · 강의실 진입 방법(카카오 로그인 → 내 강의실 → 강의목록) 안내와 수강 문의는 머니업클래스 채널로 · 전세 거주지로 사업자 등록은 임대차계약서 사본 제출이면 된다는 답 · 대면등록권은 제품이 나온 뒤 실제 상품 등록 때 쓰는 것을 권장하며 기한 없이 1회 2시간이라는 답 · 별도 전화번호는 아톡 앱 070번호나 eSIM으로 해결한다는 답 · 제조공장 견학은 9/29(화)로 결정, 오전·오후 투표 예고 · 경기도 사업자의 장점은 과밀억제권역 문제이며 비상주오피스는 비상주어때에 문의하고 최종은 세무사·세무서 확인이라는 답 · 9/9 유통전문판매업 오프라인 교육은 온라인 사전 접수 필수이고 사업자 먼저 내고 듣기 권장, 영업신고증은 사업장 주소지 관할 위생과 · 토스페이먼츠 사업자 등록은 주소 입력 화면이 안 나올 수 있고 한 사업장당 한 주소라는 답 · 2022년 수료한 일반판매업 교육은 유효기간 2년이 지나 다시 들어야 한다는 답 · 온라인·오프라인 강의는 내용과 케어가 동일하고 대면등록도 같다는 답, 강사의 하루 매출 690만 원·광고비 0.76% 공유 · 스마트스토어 가입은 사업자 나온 뒤, 빠른정산 하나은행 계좌 전엔 개인계좌로 시작하라는 답 · 구매안전서비스 이용확인증이 없다는 질문은 답변 대기", "qa": [{"q": "완강 후 제조하려면 사업자등록증에 제조업을 추가해야 하나요?", "a": "위탁제조이기 때문에 사업자등록증에 제조업을 별도로 추가할 필요가 없습니다.", "by": "코치"}, {"q": "업로드된 1주차 강의와 PDF 자료는 어디서 보나요? 내 강의실에 들어가도 강의가 안 보여요.", "a": "머니업클래스에 카카오톡으로 로그인한 뒤 내 강의실 → 강의목록(좌측 상단)에서 1주차 강의를 누르면 됩니다. 총 4개 영상이며 PPT 자료는 1강 1교시 영상 하단에서 다운로드. 매주 토요일 오프라인 강의를 현장 녹화해 올리는 방식이고 6개월간 무제한 수강 가능. 그래도 안 보이면 머니업클래스 채널로 문의.", "by": "강사(하니쌤)"}, {"q": "전세로 사는 집 주소로 사업자를 낼 수 있나요?", "a": "온라인 판매처럼 별도 매장이 필요 없는 경우 전세계약서(임대차계약서) 사본을 제출하면 됩니다. 묵시적 갱신이면 만료된 계약서를 내도 되지만 세무서에서 현재 임대차 관계 확인용 추가 자료를 요청할 수 있습니다.", "by": "강사(하니쌤)"}, {"q": "1:1 대면등록권은 언제 쓰고 몇 회인가요?", "a": "제품이 나오고 나서 실제 상품 등록을 할 때 쓰는 것을 권장하며, 사용 기한이 없으니 천천히 생각해도 됩니다. 1회, 2시간 정도입니다.", "by": "강사(하니쌤)"}, {"q": "직장을 다니며 시작하는데 사업용 전화번호를 따로 만들어야 하나요?", "a": "아톡 앱을 설치하면 070 번호를 쓸 수 있고, eSIM으로 한 폰에 두 번호를 쓸 수도 있습니다.", "by": "강사(하니쌤)"}, {"q": "제조공장 견학 날짜가 정해졌나요?", "a": "직장 때문에 미리 알려 달라는 분들이 많아 9월 29일(화)로 일단 결정됐고, 오전팀·오후팀 참석 여부 투표와 함께 다시 공지 예정. (지원 코치: 견학은 제조사와 협의 후 3~4주차 진행 중 안내)", "by": "강사(하니쌤)"}, {"q": "경기도에서 사업자를 내면 지원제도 등 장점이 있나요? 비상주오피스 주소는 어디서 받나요?", "a": "단순히 경기도라서가 아니라 사업장 주소가 과밀억제권역 안인지 밖인지의 문제입니다. 주소지는 요건 중 하나일 뿐이고 기존 사업 여부·업종·창업 이력에 따라 혜택이 달라지므로 최종은 세무사나 관할 세무서 확인이 가장 정확. 비상주오피스는 '비상주어때'에 문의하면 더 명확한 정보를 받을 수 있습니다. 사업자 이메일은 도메인 없이 네이버·gmail로 충분.", "by": "강사(하니쌤)"}, {"q": "9/9 유통전문판매업 오프라인 교육을 받으려면 그 전에 사업자를 내야 하나요? 예약이 필요한가요? 영업신고증은 어느 위생과에 문의하나요?", "a": "최근엔 사업자가 없어도 신청이 되지만 웬만하면 사업자를 먼저 내고 수료하는 것을 권장. 오프라인 교육은 온라인 접수가 필수이며 인원이 차거나 교육 이틀 전쯤부터는 마감되니 미리 신청(8/26 접수 오픈, 오픈런까지는 불필요). 건기식 영업신고증은 사업장 주소지 관할 위생과. 참고로 강사의 토요일 오프라인 강의 자체는 예약 불필요(운영진).", "by": "강사(하니쌤)"}, {"q": "토스페이먼츠로 사업자 등록을 했는데 사업장 주소 입력이 안 나왔어요. 기존 사업자와 같은 주소로 추가해도 되나요?", "a": "토스페이먼츠 바로신청은 홈택스보다 절차가 간소화돼 주소 입력 화면이 안 나올 수 있으며, 신청 완료됐다면 접수된 것으로 보고 발급 후 사업자등록증의 소재지를 확인하면 됩니다. 정보가 부족하면 추가 확인 요청이 올 수 있음. 사업장 하나당 주소 하나라 같은 주소로 중복 등록은 안 됩니다. 수강생 경험으로는 통장 정보·신분증 촬영 없이 접수돼도 사업자등록증이 정상 발급됐다고 함.", "by": "강사(하니쌤)"}, {"q": "2022년에 위생교육센터 일반판매업 신규 교육을 수료했으면 다시 안 들어도 되나요?", "a": "유효기간 2년이 지났으므로 갱신하거나 다시 들어야 합니다.", "by": "강사(하니쌤)"}, {"q": "사업자 통장은 하나은행에 방문해야 하나요? 월정산이면 아무 통장이나 되나요? 전체 순서는 어떻게 되나요?", "a": "하나은행 통장도 온라인 개설이 가능하며, 월정산으로 받을 거면 어떤 통장을 써도 됩니다. 순서는 강의에서 설명한 그대로 진행하면 되고, 빠른정산용 하나은행 통장을 개설하려면 쿠팡 판매자 가입이 먼저라, 그 전에 계좌 등록이 필요한 단계는 일단 개인 계좌로 하고 나중에 빠른정산 계좌로 변경하면 됩니다. 스마트스토어 가입은 사업자등록증이 나온 뒤에.", "by": "강사(하니쌤)"}, {"q": "브랜드명을 정했으면 로고도 만들어야 하나요? 영어 브랜드명도 되나요? 사업자명·브랜드 기획을 미리 조언받을 수 있나요?", "a": "로고를 따로 만드는 업체도, 브랜드명 자체를 로고로 쓰는 업체도 많고 영어·한글 모두 가능하니 2주차 기획 강의를 들으며 천천히 정하면 됩니다(코치). 사업자명은 크게 중요하지 않아 먼저 내도 되지만, 매 강의마다 방향이 달라지므로 제조는 완강 후를 권장. 이번주 강의에서 썸네일·상세페이지 디자인 팁을 다루니 먼저 보고 편하게 연락(강사).", "by": "강사(하니쌤)·코치"}], "notices": ["제조 지원 코치 소개 — 에이브바이오랩스 제조 관련 문의는 지원 코치 프로필의 1:1 대화로", "제조 전 OEM계약서 작성과 제조승인요청서 제출 필요, 제조 의뢰 시 일반식품유통전문판매원 보유 필수 · 건온연B2B 도매 승인은 오전 9시·1시·5시 일괄 처리 · 3PL/4PL은 (주)디엔에스로지스와 물류 위탁 계약", "8/22 1주차 정규강의 업로드 — 머니업클래스 사이트 [내 강의실]에서 시청, 강의자료는 1교시 영상 하단에서 다운로드, 수강 관련 문의는 머니업클래스 채널로", "1교시 영상 일부 구간 카메라 초점이 흐림(2·3교시는 정상, 음성·내용 전달엔 영향 없음)", "제조공장 견학 9/29(화) 예정 — 오전팀·오후팀 참석 여부 투표와 함께 재공지 예정", "강사의 오프라인 강의는 별도 예약 불필요, 건강식품 관련 오프라인 교육(유통전문판매업)은 온라인 접수 필요"], "links": [{"label": "제조승인요청서(구글폼)", "url": "https://forms.gle/LWVFxBw1bVtjGBU9A"}, {"label": "에이브바이오랩스 제조 의뢰", "url": "https://www.aevbiolabs.com/contact-us"}, {"label": "유통전문판매원 발급 방법(네이버 카페)", "url": "https://cafe.naver.com/sales2013/17529"}, {"label": "건온연B2B 도매 홈페이지", "url": "https://gonyb2b.com/"}, {"label": "도매승인요청서(구글폼)", "url": "https://forms.gle/C51c6vByAuzXXLiDA"}, {"label": "도매/제조 이용가이드 요약본(구글 문서)", "url": "https://docs.google.com/document/d/1oiBe1INdnuLX1AZkgRi-d9rqzpy1qqfqzYDXRXd2LcY/edit?usp=sharing"}, {"label": "머니업클래스 사이트(내 강의실)", "url": "https://www.moneyupclass.com/"}, {"label": "강의 수강 방법 안내", "url": "https://buly.kr/CqTRkj"}, {"label": "머니업클래스 카카오톡 채널(수강 문의)", "url": "https://pf.kakao.com/_mxffBn"}], "label": "8/24 (월)"}, {"date": "2026-08-23", "summary": "어제 강의 영상이  도매 및 소매업, 종목은 전자상거래 소매업. 위탁제조라 제조업을 추가할 필요는 없습니다. 사업자등록증에는 업종코드가 표시되지 않는 것이 정상이고, 홈택스에서 사업자로 전환해 로그인해야 나의 민원 처리현황에서 등록증을 내려받을 수 있습니다. 접수증의 담당 세무서 직원에게 전화하면 당일 발급되기도 합니다.", "dates": ["2026-08-24", "2026-08-25", "2026-08-26", "2026-09-01"]}, {"category": "사업자 등록·세금", "q": "사업장 주소는 꼭 있어야 하나요? 전셋집이나 비상주오피스도 되나요?", "a": "주소는 꼭 필요합니다. 자가나 전셋집이면 임대차계약서 사본을 내면 되고, 비상주오피스도 됩니다. 다만 한 사업자당 주소 하나라 같은 주소로 두 개를 낼 수는 없습니다. 비상주오피스를 쓸 거면 그 주소로 유통전문판매업 영업신고까지 되는지 계약 전에 업체에 확인하세요. 세금 혜택은 경기도라서가 아니라 과밀억제권역 밖인지의 문제이고, 최종 판단은 세무사나 관할 세무서에 확인합니다.", "dates": ["2026-08-24", "2026-08-25", "2026-09-10"]}, {"category": "사업자 등록·세금", "q": "간이과세자와 일반과세자 중 뭘로 내나요?", "a": "직전연도 매출 1억 400만 원 미만이면 간이, 이상이면 일반입니다. 간이는 부가세 환급이 안 되고 일반은 매입세액이 많으면 환급됩니다. 기존에 일반사업자가 있으면 간이가 안 되므로 그냥 일반으로 내면 되고, 그렇게 해도 괜찮습니다.", "dates": ["2026-08-26", "2026-09-01"]}, {"category": "사업자 등록·세금", "q": "이미 온라인 판매 사업자가 있는데 새로 내야 하나요?", "a": "기존 사업자로 건강식품도 팔 수 있습니다. 온·오프라인 교육 두 가지를 수료하고 영업신고증만 받으면 되고, 통신판매업신고증과 구매안전서비스 이용확인증은 그대로 씁니다. 다만 공산품과 건강식품을 한 계정에 섞으면 성과 분석이 어렵고 소비자 신뢰가 떨어질 수 있어, 건강식품 품목을 늘릴 계획이면 새 사업자로 분리를 권합니다. 볼륨이 커진 뒤 분리해도 됩니다.", "dates": ["2026-08-23", "2026-08-25", "2026-08-27"]}, {"category": "사업자 등록·세금", "q": "가족 명의로 사업자를 내도 되나요?", "a": "직장 겸업 등의 사유로 가족 명의로 내는 경우가 있습니다. 다만 4시간 집합 위생교육은 대리인이 직원이어야 하므로 1인 사업자라면 대표자 본인이 직접 가야 합니다.", "dates": ["2026-08-23", "2026-08-27", "2026-09-10"]}, {"category": "영업신고·위생교육", "q": "위생교육은 뭘 들어야 하고, 예전에 들은 수료증은 쓸 수 있나요?", "a": "온라인 2시간(건강기능식품 일반판매업)과 오프라인 4시간 집합교육(유통전문판매업) 두 가지입니다. 수료증 유효기간은 2년이라 2022년 이전 수료증은 다시 들어야 합니다. 온라인 교육은 사업자 없이도 들을 수 있지만, 수료증에 사업자 상호와 주소가 적히므로 사업자를 먼저 내고 듣는 것을 권합니다. 집합교육은 온라인 접수가 필수이고 교육 이틀 전쯤 마감되니 미리 신청하세요. 4시간 온라인 교육을 이미 들었다면 2시간 교육을 안 들어도 되는 경우가 있지만 지자체마다 다르니 위생과에 확인합니다. 10월에 들어도 늦지 않습니다.", "dates": ["2026-08-23", "2026-08-24", "2026-08-25", "2026-08-28"]}, {"category": "영업신고·위생교육", "q": "영업신고는 어디서 하고, 뭘 가져가나요?", "a": "사업장 주소지 관할 위생과에 본인이 신분증을 들고 직접 갑니다. 정부24 온라인 신청도 됩니다. 우리는 건강기능식품이 아니라 일반가공식품을 OEM으로 만들어 내 브랜드로 파는 유통전문판매업이라고 설명하면 됩니다. 필요 서류는 담당자마다 달라 수료증만으로 1시간 만에 나온 경우도, 임대차·OEM·3PL 계약서까지 낸 경우도 있습니다. 방문 전 위생과에 전화해 서류를 확인하고 한 번에 갖춰 가세요. 위생교육 접수증은 폰 바코드 대신 출력해 가는 편이 안전합니다. 요구 서류 중 위탁생산계약서는 OEM 계약서를 말하고, 임대차계약서는 사업자 주소가 임대 사무실일 때만 해당하며 자택이면 필요 없습니다. '건강진단 결과서'는 예전 보건증의 바뀐 이름입니다.", "dates": ["2026-08-26", "2026-09-06", "2026-09-09", "2026-09-10", "2026-09-16", "2026-09-21", "2026-10-01"]}, {"category": "영업신고·위생교육", "q": "집 주소라서 영업신고가 반려됐어요. 어떻게 하나요?", "a": "일반 거주 건축물이라 반려되면 비상주오피스를 계약해 그 주소로 신고합니다. 집 주소는 창고로 분류할 수 없다며 창고 계약서를 요구하면 3PL 물류 계약서를 내면 됩니다. 임대차계약서가 배우자 명의면 사용승낙서 같은 추가 증빙을 담당자에게 물어보세요. 지자체에 따라 아파트 주소로 받아준 곳도 있습니다. 비상주오피스 주소로 신고한 뒤 지자체에서 실제 영업 여부 확인 공문이 오기도 하는데, 정상 계약을 유지하며 실제 영업 중이면 문제없고 비상주 업체에 문의하면 됩니다.", "dates": ["2026-09-10", "2026-09-11", "2026-10-06"]}, {"category": "영업신고·위생교육", "q": "위생과에서 OEM 계약서나 제조사 영업등록증을 요구해요.", "a": "OEM 계약서는 공지 댓글에 코치가 올린 양식으로 작성해 가져갑니다. 영업등록증은 OEM 제조업체의 것을 말하며, 물류·OEM 계약서 맨 끝장에 붙어 있고 없으면 업체에 문의해 받습니다. 계약 날짜가 안 보인다고 반려되면 계약서를 캡처해 한글 파일로 만들어 담당자 메일로 보내 통과한 사례가 있습니다.", "dates": ["2026-09-10", "2026-09-11", "2026-10-08"]}, {"category": "영업신고·위생교육", "q": "위생과 담당자가 유통전문판매업으로 신고하라거나 제조 허가증을 요구해요.", "a": "우리는 건강기능식품이 아니라 일반 식품을 HACCP 제조사에 위탁해 내 브랜드로 파는 것이므로, 위생과에는 '일반 식품'이라고 말합니다. 온라인 2시간 교육(건강기능식품 일반판매업)과 오프라인 4시간 집합교육(유통전문판매업)을 둘 다 들었으면 교육은 끝난 것이고, 영업신고증만 있어도 제조할 수 있습니다. 담당자마다 말이 달라 실랑이가 생기기도 하는데, 수강생 대부분은 건강기능식품 영업신고증 없이 진행했습니다.", "dates": ["2026-10-07", "2026-10-08"]}, {"category": "통신판매업·스마트스토어", "q": "통신판매업 신고는 어디서, 어떤 순서로 하나요?", "a": "홈택스가 아니라 정부24에서 합니다. 순서는 사업자등록증 → 네이버 스마트스토어 가입 → 구매안전서비스 이용확인증 출력 → 통신판매업 신고 → 수수료 납부 후 신고증 발급. 판매방식 인터넷, 취급품목 식품, 구체적 품목 건강식품 정도로 적습니다. 도메인은 쿠팡으로 적어도 통과되지만 시청에서 네이버로 하라고 하면 스마트스토어 주소로 적으면 됩니다. 처리 기간은 안내상 72시간이고 전화하면 빨라집니다. 현금영수증가맹점 가입도 어차피 해야 하니 같이 해 두세요.", "dates": ["2026-08-26", "2026-08-29", "2026-09-02"]}, {"category": "통신판매업·스마트스토어", "q": "스마트스토어에 구매안전서비스 이용확인증 버튼이 안 보여요.", "a": "PC에서 스마트스토어센터 → 판매자정보 → 판매자 관리 → 판매자 정보 우측 상단에 있습니다. 안 보이면 국내 개인 판매자로 가입된 경우이니 판매자정보 → 사업자 전환에서 사업자등록증 정보로 전환 신청하세요. 심사가 끝나기 전에도 버튼이 바로 생깁니다. 통신판매업 신고 전이면 가입 시 미신고로 두고 진행합니다.", "dates": ["2026-08-25", "2026-08-26", "2026-08-28"]}, {"category": "통신판매업·스마트스토어", "q": "스마트스토어 가입 정보는 뭘로 적나요?", "a": "업종은 전자상거래 소매업, 통신판매업 신고 전이면 미신고로 진행합니다. 스토어명·URL·소개글은 사업자명과 달라도 되고 브랜드명을 적지 않아도 됩니다. 출고지와 반품교환지는 실주문이 들어올 수 있으니 3PL 주소로 해 둡니다. 정산계좌는 토스페이먼츠 신청 때 계좌와 같을 필요가 없습니다.", "dates": ["2026-08-25", "2026-08-26", "2026-08-27", "2026-08-29"]}, {"category": "쿠팡 입점·정산", "q": "쿠팡윙 가입은 언제 하고, 비즈니스 형태는 뭘 고르나요?", "a": "사업자등록증만 있으면 가입할 수 있습니다. 비즈니스 형태는 브랜드 오너/제조, 대표 카테고리는 식품. 고객확인제도 등록하기 항목은 서류를 다 냈으면 안 보이는 것이 정상이고, 판매자 정보 검수 승인까지 하루 정도 걸립니다. 지금 꼭 해야 하는 건 아니지만 미리 입점해 두면 2~3강의 쿠팡윙 사용법을 바로 따라 할 수 있습니다. 반품지의 택배사 계약여부는 없음, 제주·도서산간 배송불가 표시가 맞습니다.", "dates": ["2026-08-27", "2026-08-28", "2026-08-31"]}, {"category": "쿠팡 입점·정산", "q": "쿠팡 입점이 내부심사기준으로 거부됐어요.", "a": "사업자등록증의 업태가 도매 및 소매업, 종목이 전자상거래 소매업으로 되어 있는지 먼저 확인하고 재신청합니다. 콜센터는 자동응답만 돌아가니 이메일로 거부 사유를 받아 보는 것이 좋습니다. 반복 반려 시 판매자 지원 메일에 사업자등록증 업태 부분을 표시한 사진과 반려 문서를 붙여 보낸 사례가 있습니다. 업체코드 오류가 나면 판매자정보 입력을 다 마쳤는지 확인하세요.", "dates": ["2026-09-01", "2026-09-04"]}, {"category": "쿠팡 입점·정산", "q": "정산은 빠른정산·주정산·월정산 중 뭘 고르나요? 빠른정산이 안 돼요.", "a": "여건이 되면 월정산이 가장 깔끔하지만 월초 판매분은 약 두 달 묶입니다. 자본금이 적으면 빠른정산을 쓰되, 최근에는 판매이력(보통 3개월)을 보고 대상자를 정하므로 신규 계정은 대상자가 아니라고 나옵니다. 그때는 개인계좌나 사업자통장으로 시작하고, 3강 내용대로 올라 선정산을 쓰다가 판매내역이 생기면 쿠팡 승인 후 전환합니다. 빠른정산은 사업자당 한 계정이고 하나은행 계좌가 필요합니다. 정산유형 변경은 판매자정보 → 추가판매자정보 → 정산정보에서 하며, 주정산에서 월정산으로 바꾸면 다음 달 1일부터 적용됩니다. 한 달 매출 10만 원을 넘기자 빠른정산 신청이 열렸다는 수강생 사례가 있습니다.", "dates": ["2026-08-24", "2026-08-25", "2026-08-26", "2026-08-28", "2026-09-10", "2026-10-08"]}, {"category": "쿠팡 입점·정산", "q": "로켓그로스와 윙판매(판매자배송)는 뭐가 다른가요?", "a": "로켓그로스는 쿠팡 창고에 재고를 넣어 두고 쿠팡이 배송하는 방식, 윙판매(판매자배송)는 3PL 창고에서 발송하는 방식입니다. 쿠팡 창고 입고에는 바코드 작업과 박스 서류 부착이 필요한데 이 작업을 3PL이 대신해 주므로 3PL을 거칩니다. 제작한 물량은 전부 쿠팡으로 보내지 않고 일부를 3PL에 두어 판매자배송용으로 씁니다.", "dates": ["2026-08-22", "2026-08-31", "2026-09-04", "2026-09-11"]}, {"category": "쿠팡 입점·정산", "q": "쿠팡에서 전화·문자가 자꾸 와요. 광고담당자 말을 따라야 하나요?", "a": "판매자로 가입하면 광고·그로스·관리 담당자에게서 전화가 오기 시작합니다. 상품등록 시기를 묻거나 '가계정으로 확인되지 않도록 판매 요청', '판매자 강화기준안' 같은 연락은 형식적인 것이니 가볍게 넘기면 됩니다. 광고담당자는 광고를 많이 쓰게 하는 역할이라 매출최적화 광고를 권해도 실행하지 말고 강사·코치 가이드를 기준으로 삼으세요. 출고 불가 일정은 미리 휴무일로 설정해 두면 판매자점수가 깎이지 않습니다.", "dates": ["2026-09-15", "2026-09-16", "2026-09-17"]}, {"category": "쿠팡 입점·정산", "q": "상품에 붙는 '쿠팡추천' 표시는 광고인가요?", "a": "광고가 아니라 잘 팔려서 쿠팡이 자체 기준으로 붙이는 표시이고, 광고는 오른쪽 아래에 표시됩니다. 기준은 쿠팡만 압니다. 썸네일에 '쿠팡추천' 문구를 직접 넣으면 제재 대상이니 넣지 마세요.", "dates": ["2026-09-16"]}, {"category": "OEM·3PL 계약", "q": "OEM 계약서는 언제 쓰고, 어떻게 작성하나요?", "a": "제조 진행 시 필요한 계약서지만 영업신고 때 위생과에 낼 수 있으니 미리 써 두면 수월합니다. 개인사업자는 사업자등록번호나 주민등록번호 중 하나만 적고 법인등록번호란은 하이픈(-)만 표시합니다. 도장은 안 파도 되고 서명만 하면 됩니다. OEM 사이트 가입 승인은 매일 오후 5시에 일괄 처리됩니다. 사업자 정보가 바뀌어 다시 써야 하거나 기타 문의는 제조사 1:1 채널 상담으로 합니다.", "dates": ["2026-09-01", "2026-09-03", "2026-09-08", "2026-09-09"]}, {"category": "OEM·3PL 계약", "q": "계약서를 다운받으면 감사추적인증서만 나와요.", "a": "받은 zip 파일을 열기만 하지 말고 압축을 풀면 안에 계약서 PDF가 있습니다. 그래도 없으면 OEM 계약서는 제조사(에이브바이오랩스) 1:1 채널 상담, 3PL 계약서는 물류업체(디앤에스로지스) 담당자에게 문의하면 카톡이나 PDF로 바로 보내줍니다. 휴대폰에서 열어 카톡으로 보낸 뒤 카톡에서 내려받는 방법도 있습니다. 완료된 3PL 계약서는 글자 위치가 어긋나 보이지만 다들 같습니다. 모두싸인에서 1페이지만 받아지는 경우도 같은 방법으로 제조사 1:1 문의하면 PDF로 받을 수 있고, 계약서 양식이 갱신돼도 이미 작성한 사람은 다시 쓰지 않아도 됩니다.", "dates": ["2026-09-05", "2026-09-07", "2026-09-08", "2026-09-10", "2026-09-28"]}, {"category": "OEM·3PL 계약", "q": "3PL 물류비는 얼마고, 계약일자는 며칠로 적나요?", "a": "보증금은 없고 택배를 보낼 때마다 택배비가 들며 보관비는 파레트당 2만 원 정도입니다. 계약일자는 3PL 대표에게 문의하면 되고, 편한 대로 적으면 된다는 답을 받았습니다. OEM 제조비용은 기본 현금 선납이지만 카드결제 시 할부가 됩니다.", "dates": ["2026-08-22", "2026-08-27", "2026-09-03", "2026-09-07"]}, {"category": "OEM·3PL 계약", "q": "제조 상담을 신청했는데 연락이 안 와요.", "a": "연휴가 끼면 제조사가 바빠 회신이 늦어집니다. 신청할 때 닉네임이 아니라 성함과 연락처로 적었는지 확인하고, 급하면 제조사 대표번호로 직접 전화하거나 운영진에게 말하면 제조사에 확인해 줍니다. 명절 전에 신청한 사람이 연휴 뒤 신청자보다 먼저 안내받습니다. 제조사는 070 번호로 전화합니다. 070이 차단돼 있지 않은지 먼저 확인하세요.", "dates": ["2026-09-17", "2026-09-21", "2026-10-08"]}, {"category": "OEM·3PL 계약", "q": "약병 색과 라벨 인쇄 일정은 어떻게 되나요?", "a": "약병은 라벨 디자인과 어울리는 색으로 고르면 되고 유광이 더 선명하게 나옵니다. 라벨 인쇄는 매주 화·금이라 월·목에 확정하면 바로 인쇄되고, 수·월에 출고일자 메일을 받습니다. 라벨과 단상자의 필수 표기는 제조사가 챙겨 주며 품목보고 후 한글표시사항을 워드로 보내 줍니다. 다른 종류의 건강식품이면 브랜드명을 두 가지 써도 됩니다. 단상자 유광·무광은 구매 요소가 아니라 판매자 취향입니다. 로고·라벨·단상자·목업을 무료로 해 주는 패키지 디자인 프로모션은 10/30(금)까지 최소 MOQ 이상 제조를 시작하면 적용되고, 이후 추가 제조 때도 유지됩니다. 목업 측면컷을 제조사가 안 주면 AI로 만들어 써도 됩니다.", "dates": ["2026-09-14", "2026-09-28", "2026-10-01", "2026-10-06", "2026-10-08"]}, {"category": "OEM·3PL 계약", "q": "디자인 요청서의 고객상담실 번호는 뭘 적나요? 제 번호를 공개하기 싫어요.", "a": "본인 번호를 적습니다. 노출하기 싫으면 아톡 앱으로 070 번호를 만들어 쓰면 전화와 문자가 다 됩니다. 로켓그로스로 넣어 두면 쿠팡으로 들어오는 1차 문의는 쿠팡이 처리하고 해결 안 되는 것만 넘어오므로 통에 적힌 번호로 오는 전화는 많지 않습니다.", "dates": ["2026-10-06"]}, {"category": "브랜드·소싱·판매전략", "q": "브랜드명은 언제 정하고, 상표등록은 지금 해야 하나요?", "a": "브랜드명은 제품이 나오기 전 기획 단계(2주차)에서 정하고, 한글·영문 표기는 자유입니다. 반드시 키프리스에서 상표권 검색을 해서 겹치지 않는 이름으로 정하세요. 사업자 상호는 사업자번호로 구분되므로 중복이어도 상관없고, 브랜드명이 겹쳐도 사업자를 다시 낼 필요 없이 브랜드명만 바꾸면 됩니다. 상표 출원은 브랜드가 어느 정도 큰 뒤에 해도 늦지 않고, 애착이 있으면 미리 해도 됩니다. Health, Balance 같은 단어를 덧붙여도 됩니다.", "dates": ["2026-08-24", "2026-08-25", "2026-08-26", "2026-08-27", "2026-08-28", "2026-09-11"]}, {"category": "브랜드·소싱·판매전략", "q": "쿠팡 판매순위(오가닉 순위)는 어떻게 확인하나요?", "a": "오가닉 순위는 광고가 아닌 자연 검색으로 노출되는 순위입니다. 인터넷 기록을 지우고 시크릿 모드(PC 크롬 Ctrl+Shift+N)를 새로 연 뒤, 검색창에 '쿠팡모바일'을 검색해 앞에 m이 없는 결과로 들어갑니다. 주소를 직접 쳐서 들어가면 안 됩니다. 키워드별로 실제 팔린 양은 비즈니스 인사이트의 판매분석과 광고보고서에서 봅니다.", "dates": ["2026-09-21", "2026-09-23", "2026-10-01"]}, {"category": "브랜드·소싱·판매전략", "q": "메인키워드와 서브키워드 중 어디서 더 팔리나요? 원료 소싱은 어떤 기준으로 보나요?", "a": "검색량이 크지만 15위권인 메인키워드보다 검색량이 작아도 1~3위인 서브키워드에서 더 팔립니다(실제 사례 메인 100건 대 서브 140건). 한 제품에서 한 달 판매가 일어나는 키워드는 보통 100개 이상입니다. 소싱은 세 단계로 봅니다. 자동완성 검색어를 한 글자씩 넓혀 반복 등장하는 키워드에 점수를 매겨 메인키워드 후보를 뽑고, 비즈니스 인사이트에서 관련 키워드를 검색량 순으로 줄 세워 1~10위 제품을 열어 보고, 시크릿 모드에서 오가닉 1~10위 판매량을 계산해 3위권 판매량과 마진이 맞으면 들어갑니다. 공식이 아니라 참고용이며 케이스마다 코치와 논의합니다.", "dates": ["2026-10-01"]}, {"category": "브랜드·소싱·판매전략", "q": "새 성분을 섞거나 새 디자인으로 차별화하면 더 팔리나요?", "a": "아닙니다. 비타민C에 비오틴을 섞어도 판매가 급증하지 않고 오히려 비타민C 100% 수요가 더 많습니다. 새 시장을 만들려면 마케팅비가 크게 드니 우선 검증된 시장에서 낙수효과를 보고, 매출이 난 뒤에 다른 각을 봅니다. 디자인도 초코파이를 파란 박스로 팔면 안 팔리듯 잘 팔리는 제품의 결을 따르되 맥락으로 이해해 본인 기준 const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const nl = s => esc(s).replace(/\n/g, "<br>");
let query = "";

function hl(html){
  if(!query) return html;
  const re = new RegExp("(" + query.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "gi");
  return html.split(/(<[^>]+>)/g).map(p => p.startsWith("<") ? p : p.replace(re, "<mark>$1</mark>")).join("");
}
function hit(...parts){ if(!query) return true; const t = parts.flat().filter(Boolean).join(" ").toLowerCase(); return t.includes(query.toLowerCase()); }

function renderPinned(){

  const today = new Date(); today.setHours(0,0,0,0);
  const W = "일월화수목금토";
  const rows = dl.map(x => {
    let dday = null, cls = "", lab = "예정";
    if(x.date){
      const d = new Date(x.date + "T00:00:00"); dday = Math.round((d - today) / 86400000);
      lab = dday === 0 ? "오늘" : dday > 0 ? `D-${dday}` : `지남`;

    .sort((a, b) => (a.dday ?? 9999) - (b.dday ?? 9999));

    return `<div class="pin ${cls}"><span class="dday">${lab}</span><div><div class="t">${x.url ? `<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.label)}</a>` : esc(x.label)}</div><div class="s">${esc(when)}${x.note ? " · " + esc(x.note) : ""}</div></div></div>`;

  $("#pin-links").hidden = !ln.length;
}

}

    if((d.qa||[]).length) secs.push(`<div class="sec"><h3>질문과 답변 ${d.qa.length}건</h3>${qaHtml(d.qa)}</div>`);
    if((d.notices||[]).length) secs.push(`<div class="sec"><h3>공지</h3><ul class="plain">${d.notices.map(n => `<li>${hl(nl(n))}</li>`).join("")}</ul></div>`);
    if((d.links||[]).length) secs.push(`<div class="sec"><h3>링크</h3><ul class="plain">${d.links.map(l => `<li><a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label||l.url)}</a></li>`).join("")}</ul></div>`);
    return `<details class="day" ${query || i === 0 ? "open" : ""}>
      <summary>
        <div class="dh"><span class="arrow">▲</span><span class="date">${esc(d.label)}</span>${isLatest ? `<span class="new">최신</span>` : ""}<span class="cnt">Q&amp;A ${(d.qa||[]).length}</span></div>
        <div class="summary">${hl(nl(d.summary))}</div>
      </summary>
      <div class="body">${secs.join("") || `<p class="empty">이날은 요약만 있습니다.</p>`}</div>
    </details>`;
  }).join("");
}

function renderFaq(){
  const box = $("#panel-faq");
  const faq = (DATA.faq||[]).filter(x => hit(x.q, x.a, x.category));
  if(!faq.length){ box.innerHTML = `<div class="empty">${DATA.faq && DATA.faq.length ? "검색 결과가 없습니다." : "아직 정리된 자주 묻는 질문이 없습니다."}</div>`; return; }
  const groups = {};
  faq.forEach(x => { (groups[x.category || "기타"] ||= []).push(x); });
  box.innerHTML = Object.entries(groups).map(([cat, items]) => `
    <div class="cat"><h2>${esc(cat)} <span class="n">${items.length}</span></h2>
    <div class="qa">${items.map(x => `
      <div class="item">
        <div class="q"><span class="k">Q</span><div>${hl(nl(x.q))}</div></div>
        <div class="a"><span class="k">A</span><div>${hl(nl(x.a))}</div></div>
        ${(x.dates||[]).length ? `<div class="chips">${x.dates.map(dt => `<span class="chip">${esc(dt.slice(5).replace("-","/"))}</span>`).join("")}</div>` : ""}
      </div>`).join("")}</div></div>`).join("");
}

function renderFiles(){
  const box = $("#panel-files");
  const all = DATA.files || [];
  if(!all.length){ $("#tab-files").hidden = true; return; }
  $("#tab-files").hidden = false;
  const files = all.filter(f => hit(f.name, f.desc, f.source, f.category));
  if(!files.length){ box.innerHTML = `<div class="empty">검색 결과가 없습니다.</div>`; return; }
  const groups = {};
  files.forEach(f => { (groups[f.category || "자료"] ||= []).push(f); });
  box.innerHTML = `<div class="note">파일 자체는 이 페이지에 올리지 않습니다. 어떤 자료가 언제 나왔고 어디서 받는지만 적어 둡니다.</div>` +
    Object.entries(groups).map(([cat, items]) => `
    <div class="cat"><h2>${esc(cat)} <span class="n">${items.length}</span></h2>
    <div class="qa">${items.map(f => `
      <div class="item">
        <div class="q"><span class="k">📄</span><div>${hl(esc(f.name))}${f.pages ? ` <span class="chip">${f.pages}쪽</span>` : ""}</div></div>
        ${f.desc ? `<div class="a"><span class="k"></span><div>${hl(nl(f.desc))}</div></div>` : ""}
        <div class="chips">${f.date ? `<span class="chip">${esc(f.date.slice(5).replace("-","/"))}</span>` : ""}${f.source ? `<span class="chip">${esc(f.source)}</span>` : ""}</div>
      </div>`).join("")}</div></div>`).join("");
}

const TABS = ["days", "faq", "files"];
function selectTab(which){
  if(!TABS.includes(which) || (which === "files" && $("#tab-files").hidden)) which = "days";
  TABS.forEach(t => {
    $("#tab-" + t).setAttribute("aria-selected", t === which);
    $("#panel-" + t).hidden = t !== which;
  });
  try{ localStorage.setItem("digest-tab", which); }catch(e){}
}
TABS.forEach(t => $("#tab-" + t).addEventListener("click", () => selectTab(t)));
$("#q").addEventListener("input", e => { query = e.target.value.trim(); renderDays(); renderFaq(); renderFiles(); });

renderHead(); renderPinned(); renderDays(); renderFaq(); renderFiles();
try{ selectTab(localStorage.getItem("digest-tab") || "days"); }catch(e){ selectTab("days"); }
</script>

</body>
</html>
