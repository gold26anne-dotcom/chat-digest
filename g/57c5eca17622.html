<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>html{color-scheme:light dark}</style>
</head>
<body>
<title>하니쌤 건강식품 1기 | 핵심 정리</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
:root{
  --bg:#f3f4fa; --card:#ffffff; --line:#e3e5f0; --text:#1e2130; --muted:#6b7089; --faint:#9a9fb8;
  --hero-a:#5458e3; --hero-b:#a457f2; --hero-text:#ffffff;
  --blue:#3564f0; --green:#12a77a; --violet:#8a5cf5;
  --notice-bg:#fff7d1; --notice-line:#f2df8f; --notice-text:#4a4420;
  --day-bg:#eaf1ff; --day-line:#d6e2ff; --chip:#eef0f8; --shadow:0 1px 2px rgba(20,24,60,.06), 0 8px 24px rgba(20,24,60,.06);
  --link:#2f5fe0; --q:#3564f0; --a:#12a77a;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111320; --card:#1a1d2e; --line:#2a2e45; --text:#e8e9f3; --muted:#a3a8c3; --faint:#6f7492;
    --hero-a:#4a4ed6; --hero-b:#8e46e0;
    --notice-bg:#2c2712; --notice-line:#4a4120; --notice-text:#f0e6b0;
    --day-bg:#1c2540; --day-line:#2c3a63; --chip:#252a40; --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    --link:#8eaaff; --q:#8eaaff; --a:#5fd3a9;
  }
}
:root[data-theme="dark"]{
  --bg:#111320; --card:#1a1d2e; --line:#2a2e45; --text:#e8e9f3; --muted:#a3a8c3; --faint:#6f7492;
  --hero-a:#4a4ed6; --hero-b:#8e46e0;
  --notice-bg:#2c2712; --notice-line:#4a4120; --notice-text:#f0e6b0;
  --day-bg:#1c2540; --day-line:#2c3a63; --chip:#252a40; --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  --link:#8eaaff; --q:#8eaaff; --a:#5fd3a9;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;font-size:15px;line-height:1.7;padding-inline:16px;padding-block:20px 60px}
.wrap{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
a{color:var(--link)}
.hero{position:relative;overflow:hidden;border-radius:24px;background:linear-gradient(135deg,var(--hero-a),var(--hero-b));color:var(--hero-text);text-align:center;padding-block:44px 40px;padding-inline:20px;box-shadow:var(--shadow)}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.12);filter:blur(2px)}
.hero::before{width:260px;height:260px;left:-80px;top:-100px}
.hero::after{width:200px;height:200px;right:-60px;bottom:-90px}
.hero>*{position:relative}
.badge{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:6px 16px;font-size:13px;font-weight:500}
.hero h1{margin:18px 0 8px;font-size:clamp(28px,5vw,40px);font-weight:900;line-height:1.25;text-wrap:balance;letter-spacing:-.02em}
.hero .sub{margin:0;opacity:.9;font-size:15px}
.notice{display:flex;gap:14px;align-items:flex-start;background:var(--notice-bg);border:1px solid var(--notice-line);color:var(--notice-text);border-radius:16px;padding:16px 20px}
.notice .ic{font-size:24px;line-height:1.3}
.notice p{margin:0}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 12px;text-align:center;box-shadow:var(--shadow)}
.stat b{display:block;font-size:30px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1.2}
.stat span{display:block;color:var(--muted);font-size:13px;margin-top:6px}
.stat.blue b{color:var(--blue)}.stat.green b{color:var(--green)}.stat.violet b{color:var(--violet)}
.tabs{display:flex;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:6px;box-shadow:var(--shadow)}
.tab{flex:1;border:0;background:transparent;color:var(--text);font:inherit;font-weight:500;padding:12px;border-radius:13px;cursor:pointer;transition:background .15s,color .15s}
.tab[aria-selected="true"]{background:var(--blue);color:#fff;font-weight:700}
.tab:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.search{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 14px}
.search input{flex:1;border:0;background:transparent;color:var(--text);font:inherit;outline:none;min-width:0}
.search input::placeholder{color:var(--faint)}
.panel[hidden]{display:none}
.list{display:flex;flex-direction:column;gap:12px}
.day{background:var(--day-bg);border:1px solid var(--day-line);border-radius:18px;overflow:hidden}
.day>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start;padding:18px 20px}
.day>summary::-webkit-details-marker{display:none}
.day>summary:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}
.dh{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:64px}
.dh .arrow{font-size:11px;color:var(--faint);transition:transform .2s}
.day[open] .dh .arrow{transform:rotate(180deg)}
.dh .date{font-weight:900;font-size:17px;line-height:1.2;white-space:nowrap;font-variant-numeric:tabular-nums}
.dh .new{background:var(--blue);color:#fff;font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px}
.dh .cnt{font-size:11px;color:var(--muted);white-space:nowrap}
.summary{color:var(--text);opacity:.88;font-size:14.5px;line-height:1.75;text-align:left}
.body{border-top:1px solid var(--day-line);padding:6px 20px 20px;display:flex;flex-direction:column;gap:18px}
.sec h3{margin:14px 0 8px;font-size:13px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.qa{display:flex;flex-direction:column;gap:10px}
.qa .item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px}
.qa .q,.qa .a{display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:start}
.qa .q{font-weight:700}
.qa .a{margin-top:6px;color:var(--text)}
.qa .k{font-weight:900;font-size:13px;line-height:1.9}
.qa .q .k{color:var(--q)}.qa .a .k{color:var(--a)}
.qa .by{font-size:12px;color:var(--faint);margin-left:30px}
ul.plain{margin:0;padding-left:20px}
ul.plain li{margin:4px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{background:var(--chip);color:var(--muted);font-size:12px;padding:2px 10px;border-radius:999px;font-variant-numeric:tabular-nums}
.cat{margin-top:6px}
.cat h2{font-size:17px;margin:18px 0 10px;display:flex;align-items:center;gap:10px}
.cat h2 .n{font-size:12px;color:var(--muted);font-weight:500;background:var(--chip);padding:2px 9px;border-radius:999px}
.empty{color:var(--muted);text-align:center;padding:30px}
.foot{color:var(--faint);font-size:12px;text-align:center}
.note{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:12px 16px;font-size:13.5px;color:var(--muted)}
mark{background:rgba(255,213,74,.45);color:inherit;border-radius:3px;padding:0 2px}
@media (max-width:560px){
  .stats{gap:10px}.stat b{font-size:24px}
  .day>summary{grid-template-columns:1fr;gap:10px}
  .dh{flex-direction:row;justify-content:flex-start}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header class="hero">
    <span class="badge">📋 <span id="badge-text">사담방 다이제스트</span></span>
    <h1 id="h1"></h1>
    <p class="sub" id="sub"></p>
  </header>

  <div class="notice" id="notice" hidden><div class="ic">😊</div><div id="notice-body"></div></div>

  <div class="stats">
    <div class="stat blue"><b id="st-start"></b><span>정리 시작</span></div>
    <div class="stat green"><b id="st-cohort"></b><span>현재 기수</span></div>
    <div class="stat violet"><b id="st-qa"></b><span>누적 Q&amp;A</span></div>
  </div>

  <div class="note" id="update-note" hidden></div>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-days" aria-selected="true" aria-controls="panel-days">📅 일자별</button>
    <button class="tab" role="tab" id="tab-faq" aria-selected="false" aria-controls="panel-faq">자주 묻는 질문</button>
  </div>

  <label class="search">🔍 <input id="q" type="search" placeholder="검색 (예: 플랜모드, 썸네일, 오류)" autocomplete="off"></label>

  <section class="panel list" id="panel-days" role="tabpanel"></section>
  <section class="panel" id="panel-faq" role="tabpanel" hidden></section>

  <p class="foot" id="foot"></p>
</div>

<script>
const DATA = {"title": "하니쌤 건강식품 1기 | 핵심 정리", "badge": "공지방 다이제스트", "room": "(1기) 하니쌤의 마진 45% 월3천 건강식품 공지방", "cohort": "1기", "start_date": "2026-08-21", "notice": ["1기 공지방에서 확인된 공지와 질문·답변을 핵심만 정리해요.", "공지와 링크는 실제 대화에서 확인된 내용만 담고, 수강생 이름은 적지 않아요."], "update_note": "8/21~9/14 전체 정리 (첫 정리)", "days": [{"date": "2026-09-14", "summary": "이번주 토요일 줌라이브에 Q&A 시간이 있으니 복습하고 질문을 준비하라는 강사 안내 · 4주차 강의(최대표 광고 특강)는 오늘 오후 업로드 예정이라는 답 · 29일 공장견학은 오전 10~2시, 오후 3~7시라는 답과 익산역에서 공장까지 택시 15분(10km)이라는 답 · 기차표·연차 때문에 견학 시간 투표를 빨리 열어 달라는 건의에 오전·오후반 TO는 없고 자리 배분용이며 바로 투표를 올리겠다는 답 · 라벨·단상자 필수 표기사항 질문에 제조사가 알아서 해 주며 제품명과 총내용량당 원료 함량은 필수이고 품목보고 후 한글표시사항을 워드로 준다는 답 · 운영진의 4주차 정규강의 업로드 안내 · 이번주 원료 리포트 발송과 다음 주부터 매주 TOP10 중심 트렌드 리포트 발행 예고 · 운영진의 에이브바이오랩스 패키지 디자인 무료 프로모션 안내(최소 MOQ 이상, 10/22까지 제조 시작) · 재발주 수량은 초도 배수만 되느냐는 질문에 수량은 자유롭고 수량별 단가만 다르다는 확인", "qa": [{"q": "4주차 강의는 언제 올라오나요?", "a": "오늘(9/14) 오후에 업로드 예정. 4주차 광고 강의는 무료강의에 함께 나왔던 최대표가 특강을 했다. 오후 3시 55분에 업로드 완료가 공지됐다.", "by": "강사(하니쌤)"}, {"q": "29일 공장견학은 몇 시부터 몇 시까지인가요?", "a": "오전반 10시~2시, 오후반 3시~7시.", "by": "강사(하니쌤)"}, {"q": "익산역에서 에이브바이오랩스 공장까지 택시로 얼마나 걸리나요?", "a": "15분 거리, 약 10km.", "by": ""}, {"q": "기차표·연차 때문에 견학 시간 투표를 빨리 진행해 줄 수 있나요? 오전·오후반 TO가 있나요?", "a": "따로 TO는 없고 온라인 수강생까지 함께 와서 자리가 부족할까 봐 나누는 것이다. 여건대로 오면 되며, 건의대로 빠른 투표를 올리겠다고 했다.", "by": "강사(하니쌤)"}, {"q": "라벨이나 단상자 디자인에 필수 표기사항이 따로 있나요? 제조사 디자인 지원을 받으면 신경 안 써도 되나요?", "a": "에이브바이오랩스에 제조를 맡기면 알아서 해 준다. 제품명은 필수이고 하단에 총내용량당 원료 함량이 필수로 들어가야 한다. 제조가 시작되면 품목보고 후 라벨에 들어갈 한글표시사항을 워드 파일로 전달해 준다.", "by": "강사(하니쌤)"}, {"q": "2,000개 제조 후 재발주 시 초도 발주분의 배수(2,000·4,000·6,000개)로만 가능한가요?", "a": "운영진은 맞다며 자세한 것은 에이브바이오랩스에 문의하라고 했고, 수강생이 직접 확인한 결과 수량은 자유롭게 조정 가능하고 수량별 단가만 달라진다.", "by": "운영진"}], "notices": ["이번주 토요일 줌라이브에서 Q&A 시간 진행 — 복습하고 질문 준비", "9월 12일 진행된 4주차 정규강의 업로드 완료 — 머니업클래스 사이트 [내 강의실]에서 시청, 강의 자료는 1교시 영상 하단에서 다운로드", "이번주 원료 리포트 발송. 다음 주부터 매주 브랜드·원료 TOP10 중심 트렌드 리포트 발행 예정", "[하니쌤 1기] 에이브바이오랩스 패키지 디자인 무료 프로모션 — 로고·라벨·단상자 디자인·목업 이미지 무료. 조건: 최소 MOQ 이상 제조, 수강일로부터 2개월 이내 제조 시작, 혜택 기간 2026.10.22까지(추가 제 09-11", "summary": "광진구에서 영업신고 2종(각 28,000원)과 등록세(각 27,000원)를 내고 직접 방문해 발급받았고 집 주소로도 가능했다는 후기 · 구청 신고서에서는 유통전문판매업에 체크하면 된다는 수강생 답과 최종 업태·종목 예시 공유 · 집을 창고로 볼 수 없다며 창고 계약서를 요구받은 질문에 물류창고 계약서는 3PL 계약서를 내면 된다는 강사 답 · 사업자등록증 종목이 전자상거래 소매업 하나여도 된다는 답 · 강사의 최근 한 달 매출 1억 인증과 공장강의·줌라이브 예고 · 운영진의 4주차 오프라인 투표 재안내와 마감 · 온라인 신청은 두 신고증이 동시에 나오지 않고 각각 신청한다는 답과 수강생이 올린 단계별 캡처 안내(강사가 온라인방에도 공유) · 임차인이 남편 명의인 경우 담당자에게 추가 증빙을 물어보라는 답 · 건강식품은 유통업이 아니라 일반판매업으로 신고한다는 답 · 브랜드명에 붙일 영어 단어는 제한 없다는 답 · 사진에 주민번호가 노출됐다며 삭제를 권한 코치 · 3주차 Q&A 끝부분(원료 키워드가 바뀔 때 신규 키워드 잡는 법)을 코치가 텍스트로 정리 · 가구매용 판매자배송 옵션을 남겨둘 필요 없이 로켓에 모두 입고 후 진행해도 된다는 답", "qa": [{"q": "위생과에서 집 주소는 창고로 분류할 수 없다며 창고 계약서를 첨부하라고 반려했는데 어떻게 하나요?", "a": "물류창고 계약서는 3PL 계약서를 제출하면 된다. 코치가 공지글 댓글에 올려 두었다.", "by": "강사(하니쌤)"}, {"q": "사업자등록증 종목에 전자상거래 소매업 하나만 있는데 3개를 넣어야 하나요?", "a": "1개만 있어도 된다. 건강식품 2종 신고증을 보유하면 사업자등록증에 전자상거래 소매업만 표기돼도 온라인 판매에 문제가 없고, 표기를 바꾸고 싶으면 세무서에 신고증 2종과 신분증을 가져가면 변경할 수 있다.", "by": "강사(하니쌤)"}, {"q": "정부24에서 건강기능식품 영업신고 하나만 하면 신고증 2가지가 다 나오나요?", "a": "동시에 나오지 않고 건강기능식품 일반판매업과 유통전문판매업을 각각 따로 신청한다. 수강생이 두 신고의 단계별 캡처(8장·15장)를 올려 주었다.", "by": "강사(하니쌤)"}, {"q": "임대차계약서 임차인이 남편 명의인데 제 이름으로 영업신고 주소로 쓸 수 있나요?", "a": "담당자가 추가 증빙을 요청할 수 있다. 사업자등록은 이미 이 주소로 되어 있고 임대차는 배우자 명의인데 어떤 추가 서류가 필요한지 물어보면 사용승낙서나 전대 관련 서류 등을 안내해 준다. (이후 해당 수강생은 임대차계약서 없이 접수비 5만 원대와 세금 납부로 신고증 2개를 받았다.)", "by": "강사(하니쌤)"}, {"q": "유통전문판매업은 됐는데 건강식품 유통업을 추가할 거냐고 담당자가 묻는데 맞나요?", "a": "건강식품은 유통업이 아니라 '건강기능식품 일반판매업'이다. 유통전문판매업과 건강기능식품 일반판매업 두 가지를 받으면 된다.", "by": "강사(하니쌤)"}, {"q": "브랜드명에 Health, Balance, Better Tomorrow 같은 단어를 덧붙여도 되나요?", "a": "쓰면 안 되는 단어는 없다. 마음대로 설정해도 된다.", "by": "강사(하니쌤)"}, {"q": "OEM 계약서에 계약 날짜가 안 보인다며 위생과에서 계속 반려하는데 어떻게 했나요?", "a": "계약서를 캡처해 사진으로 복사한 뒤 한글 파일로 만들어 담당자 메일로 보내 통과했다. 구청에 직접 방문해 해결한 경우도 있다.", "by": ""}, {"q": "3주차 Q&A 끝부분, 판매 중인 원료의 검색 키워드가 바뀌면 어떻게 하나요?", "a": "신규 키워드는 갑자기 커지지 않고 천천히 쌓이며, 판매페이지 점수가 높으면 쿠팡이 알아서 노출시켜 준다. 더 빨리 잡으려면 해당 키워드를 수동광고 CPC 입찰가를 높여 노출시켜 구매를 일으킨 뒤 오가닉 순위를 올리거나, 그 키워드로 가구매 최적화 작업을 한다.", "by": "코치"}, {"q": "나중에 가구매를 위해 번들 옵션 1번을 판매자배송으로 남겨두는 방법밖에 없나요?", "a": "그런 사례도 있다는 예시였을 뿐이고, 로켓에 모든 옵션을 입고시킨 다음 진행해도 무방하다.", "by": "코치"}], "notices": ["9월 12일(토) 4주차 오프라인 수업 참석 여부 투표 재안내 — 9월 11일 오후 4시 30분 마감 후 종료", "강사가 정규강의 외에 공장강의와 추가 줌라이브 소통을 이어갈 예정. 쿠팡 로직 변경에 따른 테스트 내용도 정리되면 공유 예정", "채팅방에 주민번호 등 개인정보가 보이는 사진은 올리지 말고 삭제할 것(코치)"], "links": [], "label": "9/11 (금)"}, {"date": "2026-09-10", "summary": "유통전문판매업 온라인 신고 시 수수료 26,200원 외에 등록면허세 27,000원을 따로 내야 한다는 수강생 정보 공유로 하루가 열림 · 운영진의 9/12(토) 오후 3시 4주차 오프라인 참석 여부 투표 안내(마감 9/11 오후 4시 30분) · 건강기능식품 일반판매업과 유통전문판매업 영업신고는 정부24에서 각각 따로 신청하며 첨부는 위생교육 수료증과 OEM 계약서라는 수강생들의 정리 · 구청 방문 시 OEM 제조업체 영업등록증까지 요구받았다는 질문에 지자체마다 필요 서류가 달라 방문 전 위생과에 전화로 확인하고 한 번에 가라는 강사 답 · 4시간 출석 교육은 본인이 직접 가야 한다는 답 · 집 주소로 낸 영업신고가 반려된 수강생에게 비상주 오피스를 알아보라는 안내(추천인 코드는 하니쌤) · 온라인 신청 첨부서류·수수료(지역별 5~11만 원대)·처리 기준이 담당자마다 다르다는 후기가 이어짐 · 물류계약서 끝장에 업체 영업등록증이 붙어 있다는 코치 안내 · OEM 계약서 다운로드 시 감사추적인증서만 내려받아진다는 질문에 제조사 1:1 상담으로 PDF를 받으라는 답 · 쿠팡윙 빠른정산 대상자가 아니라는 질문에 올라 선정산을 먼저 쓰다가 판매내역 발생 후 승인받는다는 답", "qa": [{"q": "건강기능식품 영업신고증과 유통전문판매업 영업신고증은 온라인으로 어떻게 신청하나요? 동시에 되나요?", "a": "둘 다 정부24에서 각각 따로 신청한다. 건강기능식품은 '일반판매업'으로, 식품영업신고는 '유통전문판매업'으로 신청하며, 식품영업신고 발급하기에서 영업 종류를 유통전문판매업으로 고르고 위생교육 수료증과 OEM 계약서를 첨부한다. 식품용수 등 해당 없는 항목은 수돗물·해당없음으로 체크하면 된다.", "by": ""}, {"q": "구청 위생과에서 OEM 계약서와 영업등록증 사본을 가져와야 신고증을 준다는데 어떻게 해야 하나요?", "a": "OEM 계약서는 공지 댓글에 코치가 올린 양식으로 작성해 가져가면 된다. 영업등록증은 어떤 것을 말하는지 위생과에 전화로 확인해야 하며, 지자체마다 필요 서류가 다르므로 방문 전 필요 서류를 확인하고 한 번에 갖춰 가는 것이 좋다. (확인 결과 OEM 제조업체의 영업등록증이었다.)", "by": "강사(하니쌤)"}, {"q": "건강기능식품 영업신고 온라인 신청 시 '건강기능식품 일반판매업'에 체크하면 되나요?", "a": "맞다. 일반판매업으로 체크한다.", "by": "강사(하니쌤)"}, {"q": "가족 명의로 사업을 하려는데 출석해서 듣는 4시간 위생교육은 꼭 당사자가 가야 하나요?", "a": "본인이 직접 가야 한다.", "by": "강사(하니쌤)"}, {"q": "집 주소로 영업신고를 했더니 일반 거주 건축물이라 반려됐는데 사무실을 대여해야 하나요?", "a": "이전에 안내한 비상주 오피스에 연락해 계약하면 된다. 추천인 코드는 '하니쌤'을 입력한다. 다만 지자체에 따라 아파트 주소로 사업자등록·영업신고를 받아준 곳도 있다.", "by": "강사(하니쌤)"}, {"q": "온라인 신청 시 첨부서류는 2시간·4시간 수료증만 내면 되나요?", "a": "담당자마다 기준이 다르다. 수료증만 첨부해 1시간 만에 나온 경우도 있고, 임대차·3PL·OEM 계약서까지 전부 첨부해 통과한 경우도 있다. 서류가 미비하면 담당자가 전화로 알려주니 먼저 넣어 보라는 의견이 많았다.", "by": ""}, {"q": "물류(3PL) 계약 시 업체의 제조·가공 영업등록증 사본은 어디서 받나요?", "a": "물류·OEM 계약서 맨 끝장에 관련 서류가 붙어 있다. 없으면 업체에 문의해 받을 수 있다.", "by": "코치"}, {"q": "OEM 계약서를 작성했는데 다운로드하면 감사추적인증서만 나옵니다. 계약서는 어떻게 받나요?", "a": "제조사(에이브바이오랩스) 1:1 채널 상담으로 문의하면 카톡이나 PDF로 계약서 파일을 빠르게 보내준다.", "by": ""}, {"q": "쿠팡윙에서 셀러월렛 빠른정산 대상자가 아니라고 나오는데 뭐가 잘못됐나요?", "a": "3강 내용대로 우선 올라 선정산을 쓰다가 쿠팡에 판매내역이 생기면 쿠팡 본사 승인 후 가능해진다. 올라 선정산 가입 시 추천인 코드는 하니쌤 코드를 입력한다.", "by": ""}, {"q": "디앤에스로지스 완료 계약서를 열면 글자 위치가 어긋나고 서명이 크게 나오는데 다른 분도 그런가요?", "a": "다른 수강생도 같았다. 예쁘게는 나오지 않는다.", "by": ""}], "notices": ["9월 12일(토) 오후 3시 4주차 오프라인 수업 참석 여부 투표 — 마감 9월 11일(금) 오후 4시 30분. 미참 시 무편집 현장녹화본을 머니업클래스 내강의실에서 수강 가능", "OEM 계약서 양식은 공지글 댓글에 코치가 올려 두었으니 작성해서 위생과에 제출"], "links": [{"label": "에이브바이오랩스 1:1 상담 채널(OEM 계약서 문의)", "url": "https://bobusang.channel.io/home"}], "label": "9/10 (목)"}, {"date": "2026-09-09", "summary": "위탁제품 연습 판매도 이번에 개설한 사업자로 해도 된다는 답 · OEM계약서에 상호 도장은 안 파도 되고 서명만 하면 된다는 답 · 건온연 사이트 가입은 당일 오후 5시 일괄 승인이라는 답 · 수원 위생교육 참석자들의 교통·주차 이야기와 4시간 교육 응원 · 유통전문판매업 신고는 정부24 온라인으로 가능하고 서류는 방문과 동일하며 수수료도 조금 싸다는 수강생 정보 공유 · 정부24 발급 화면이 맞는지 묻자 강사는 온라인 경험이 없다고 했고 수강생이 맞다며 헷갈리는 항목은 관할 위생과에 물어보라는 답 · 집 주소인 경우 건물내부 면적은 집 평수, 외부는 0으로 적고 첨부파일은 수료증란에 모두 넣고 나머지는 해당사항없음으로 하면 된다는 수강생 팁과 온라인 신청 완료 소식", "qa": [{"q": "위탁제품을 연습 삼아 판매할 때 사업자를 따로 안 만들고 이번에 개설한 사업자로 해도 되나요?", "a": "그렇게 해도 된다.", "by": "강사(하니쌤)"}, {"q": "OEM계약서 작성 시 상호명 도장을 파서 찍어야 하나요?", "a": "도장은 따로 안 파도 되고 서명만 하면 된다. 다른 수강생도 대표자 이름으로 서명했다.", "by": "운영진"}, {"q": "건온연 사이트 가입 승인이 바로 안 되는데 1:1 상담을 해야 하나요?", "a": "당일 오후 5시에 일괄 승인 예정이니 5시 이후에 확인하면 된다.", "by": "운영진"}, {"q": "유통전문판매업 신고를 위생과에 직접 안 가고 온라인으로 할 수 있나요? 온라인 서류는 뭐가 필요한가요?", "a": "정부24에서 온라인으로 할 수 있고 수수료도 조금 싸다. 서류는 방문과 동일하고 접수 방식만 다르다. 다만 작성 중 헷갈리는 항목은 관할 지자체 위생과 담당자와 통화하며 진행해야 해서 시간이 있으면 직접 가는 것이 더 나을 수도 있다는 수강생 정보.", "by": ""}, {"q": "정부24 유통전문판매업 영업신고 화면에서 건물 내부·외부 장소 면적과 첨부파일은 어떻게 입력하나요?", "a": "집이 사업장이면 건물내부장소는 집 평수, 건물외부장소는 0으로 기재한다. 필요한 첨부파일은 수료증 첨부란에 전부 첨부하고 나머지는 해당사항없음을 클릭하면 된다는 수강생 팁. 이렇게 방문 없이 신청을 완료한 사례가 있다.", "by": ""}], "notices": [], "links": [], "label": "9/9 (수)"}, {"date": "2026-09-08", "summary": "전날의 사업자등록증 변경 후 OEM계약서 재작성 문의는 제조사 채팅상담으로 안내 · 9월 12일 4주차 오프라인 참석 여부 투표 안내(마감 9월 11일 오후 4시 30분) · 정상가·판매가·할인쿠폰 적용 최종판매가 가격설정 시트가 추가된 마진계산기와 금주 홈쇼핑 편성표 배포 · 건온연 카페 강의 후기 작성 요청 · 원료리포트는 다음 주에 나오며 검색은 안 되고 강사가 전달한다는 답 · 표준계약서 파일에 감사추적인증서만 있다는 문의는 OEM은 에이브바이오랩스 1:1 상담, 물류는 디앤에스로지스 담당자에게 문의하라는 답 · 소싱 감이 안 온다는 고민에 아이템스카우트는 건강식품 카테고리 최소 검색수 5천~1만 이상으로 보고 위클리리포트·아이템스카우트로 원료 선정 후 쿠팡 검증을 반복하라는 답 · OEM·3PL 계약서 링크를 공지에 올려 달라는 요청에 공지사항 댓글에 작성하겠다는 답 · OEM 사이트 관리자 승인은 오후 5시 일괄 처리라는 답", "qa": [{"q": "사업자등록증이 변경돼 OEM계약서를 다시 작성하려는데 기존 인증 중복으로 안 됩니다. 수정 부분만 직접 고쳐 써도 되나요?", "a": "OEM계약서 관련 문의는 제조사 채팅상담으로 문의하면 정확한 안내를 받을 수 있다.", "by": "운영진"}, {"q": "이번 주 원료리포트가 있나요? 수강생이 직접 검색할 수는 없나요?", "a": "원료리포트는 지난주 월요일에 나왔으므로 다음 주에 나올 예정이다. 검색은 안 되고 강사가 전달한다.", "by": "강사(하니쌤)"}, {"q": "표준계약서를 작성했는데 파일에 감사추적인증서만 있습니다. 계약서는 어디에 문의하나요?", "a": "OEM계약서는 에이브바이오랩스 1:1 상담(채널톡), 물류창고 계약서는 디앤에스로지스 담당자에게 문의하면 빠르고 자세히 안내받을 수 있다.", "by": "코치"}, {"q": "위클리리포트·아이템스카우트·쿠팡 판매량 확인을 어떻게 접목해서 소싱해야 할지 감이 안 옵니다.", "a": "아이템스카우트에서 건강식품 카테고리로 볼 때는 최소 검색수 5천~1만 이상으로 본다. 딱 접목시킨다기보다 위클리리포트와 아이템스카우트에서 원료를 선정하고 쿠팡에서 검증하는 과정을 반복하는 것이다. 원료는 정해 놓지 말고 두루두루 많이 찾아볼수록 많이 보인다.", "by": "강사(하니쌤)"}, {"q": "OEM·3PL 계약서 작성 링크와 문의처를 단톡방 공지로 등록해 줄 수 있나요?", "a": "공지사항은 플랫폼 공지와 같이 보여야 하므로 공지사항 댓글에 해당 내용을 작성하겠다. 단톡방 상단 공지사항을 더블클릭 또는 터치하면 아래 댓글에서 확인할 수 있다.", "by": "코치"}, {"q": "OEM 사이트에 가입했는데 관리자 승인은 보통 얼마나 기다리나요?", "a": "오후 5시에 일괄 처리된다. 지금 가입했다면 다음 날 오후 5시경 승인되며, 그때까지 안 되면 말하면 에이브바이오랩스에 확인 요청하겠다.", "by": "운영진"}], "notices": ["9월 12일(토) 오후 3시 4주차 오프라인 수업 참석 여부 투표 — 마감 9월 11일(금) 오후 4시 30분. 미참 시 무편집 현장녹화본 수강 가능", "정상가·판매가·할인쿠폰 적용 후 최종판매가 가격설정 탭이 추가된 마진계산기 파일 재공유(가격설정 시트/기존 마진계산기 시트 분리) 및 금주 홈쇼핑 편성표 배포", "건온연 카페 '강의 후기' 탭에 강의 후기 작성 요청", "원료리포트는 다음 주 배포 예정(강사가 직접 전달)", "OEM·3PL 계약서 링크와 문의처를 단톡방 상단 공지사항 댓글에 등록 예정"], "links": [{"label": "제조사(에이브바이오랩스) OEM 계약서 채팅상담", "url": "https://bobusang.channel.io/workflows/838067"}, {"label": 입되고 미리 입점해 두면 2~3강의 윙 사용법을 익히기 좋다는 답 · 해외직구 계정을 그대로 써도 되는지는 답변 대기", "qa": [{"q": "4시간 집합교육 신청에 사업자통장이 있어야 하나요? 결제가 안 되는데요.", "a": "통장이 아니라 사업자등록증이 있어야 신청됩니다. 모바일에서 결제가 안 되면 PC로 진행하라는 안내를 받았습니다.", "by": ""}, {"q": "쿠팡윙 가입 시 비즈니스 형태는 위탁판매·매입판매 중 무엇을 고르나요?", "a": "브랜드 오너/제조를 선택하고 아래 칸은 식품으로 합니다.", "by": "강사(하니쌤)"}, {"q": "스마트스토어 판매자센터에서 구매안전서비스 이용확인증이 출력되지 않는 이유는?", "a": "판매자 유형이 국내 개인판매자라서 그런 것이니 사업자로 전환한 뒤 확인하면 됩니다.", "by": ""}, {"q": "영업신고증은 구청에 서류를 내면 며칠 뒤에 나오나요?", "a": "구청 위생과를 방문하면 현장에서 바로 발급됩니다. 신분증과 건강기능식품 교육수료증을 지참하고, 사업자등록증은 담당자가 온라인으로 확인합니다. 통신판매업 신고는 구청 지역경제과에서 스마트스토어의 구매안전서비스 이용확인증을 가지고 하면 다음날 신고증을 받을 수 있습니다.", "by": ""}, {"q": "쿠팡의 '몇 명이 만족했어요'는 무슨 뜻이고, 아이템스카우트 검색량은 얼마나 되어야 좋은 원료인가요? 건기식에도 중국 셀러가 있나요?", "a": "만족했어요 표기는 판매량 100개 이하라는 뜻입니다. 검색량은 기본적으로 1만 이상이면 좋지만 상승세인지 하락세인지가 더 중요합니다. 건기식은 대부분 한국에서 제조해 팔기 때문에 중국 셀러가 거의 없습니다.", "by": "강사(하니쌤)"}, {"q": "쿠팡윙 정산계좌에 하나은행이 없는데 어떤 계좌를 넣나요?", "a": "빠른정산은 가입 후 조금 지나야 승인되므로 우선 개인계좌나 새로 만든 사업자통장을 입력하면 됩니다. 한 계정에는 한 계좌만 연결되며, 빠른정산을 신청하면 하나은행 계좌를 새로 개설해야 한다는 수강생 보충이 있었습니다.", "by": "강사(하니쌤)"}, {"q": "판매자 정보를 입력했는데 고객확인제도 등록하기 창이 안 뜹니다.", "a": "판매자 정보 검수가 승인되어야 생성되며 하루 정도 걸립니다. 사업자등록증 등 서류를 이미 다 제출했으면 그 항목이 안 보이는 것이 정상이고 안 뜨면 안 해도 됩니다.", "by": "강사(하니쌤)"}, {"q": "일요일 줌 강의는 몇 시에 시작해서 몇 시까지 하나요? 녹화되나요?", "a": "오전 10시에 시작하고 한 시간 반 정도 예상하면 됩니다. 일요일 강의도 녹화본이 제공됩니다.", "by": "운영진"}, {"q": "쿠팡윙 정산계좌 은행 선택이 안 되는데 스마트스토어에서 온 문자 때문인가요?", "a": "그 문자는 네이버 스마트스토어 고객확인제도 안내라서 쿠팡 정산계좌 등록과 무관합니다. 윙에서 사업자정보와 대표자 인증 등 앞 단계에 미완료 항목이 없는지 확인하고, 그래도 은행 선택란만 활성화되지 않으면 쿠팡 윙 온라인 문의로 확인하면 됩니다.", "by": "강사(하니쌤)"}, {"q": "직장인이라 집합 위생교육을 10월에나 받을 수 있는데 괜찮을까요?", "a": "10월도 충분하니 여건 되는 대로 천천히 해도 됩니다. 강의가 끝난 뒤에도 문의는 계속 할 수 있습니다.", "by": "강사(하니쌤)"}, {"q": "브랜드명은 어디에 적는 것이고, 키프리스에서 특허를 내야 하나요?", "a": "브랜드명은 나중에 제품을 제조할 때 약통에 입혀서 나오는 것이라 지금 따로 등록할 곳은 없습니다. 상표권 출원은 브랜드가 어느 정도 컸을 때 다른 셀러가 내 브랜드로 상품을 만들지 못하게 하는 조치라서 초반부터 할 필요가 없고, 판매하다 브랜드명을 바꾸는 경우도 많으니 최종 정착할 브랜드로 하면 됩니다.", "by": "강사(하니쌤)"}, {"q": "쿠팡윙은 영업신고증까지 나와야 가입할 수 있나요? 지금 꼭 해둬야 하나요?", "a": "사업자등록증만 나와도 가 일(토) 오후 3시 2주차 오프라인 수업 참석 투표 안내(마감 8월 28일 금 오후 4시 30분) · 여건 되면 월정산이 가장 깔끔하고 자본금이 없으면 빠른정산, 빠른정산 중이면 정산유형 변경 화면이 안 뜬다는 강사 답 · 통신판매업 신고와 현금영수증가맹점 가입은 필수이고 키프리스에 브랜드명이 겹치면 사업자는 그대로 두고 브랜드명만 바꾸면 된다는 답 · 간이·일반과세 기준(직전연도 매출 1억 400만 원)과 개인사업자로 등록한다는 코치 답 · 강의 시청·자료 다운로드 방법 안내 · 브랜드명 한글·영문 표기는 선택이고 기획 단계에서 정하며 상표등록은 판매가 잘된 뒤 해도 늦지 않다는 코치 답 · 공장견학은 9월 29일(화) 전북 익산, 오전반 10~14시·오후반 15~19시로 나눈다는 예고와 주말 진행은 제조사·3PL 휴무라 불가하다는 답 · 위생교육은 대리인 참석 가능하고 수원 교육은 오늘부터 신청 가능하다는 소식 · 구매안전서비스 이용확인증 버튼이 안 보이면 개인 판매자를 사업자로 전환하라는 답 · 토스페이먼츠 PG 계약은 필수가 아니고 스마트스토어 정산계좌는 다른 통장도 된다는 답 · 통신판매업 신고는 홈택스가 아닌 정부24에서 하고 네이버 가입(구매안전서비스 이용확인증)이 먼저이며 도메인에 쿠팡을 적어도 된다는 답 · 초보 수강생 중 월 300 순이익 비율과 신용카드 가맹점 가입 여부는 답변 대기 · 오프라인 강의 장소(선릉역 인텔빌딩 10층) 안내", "qa": [{"q": "쿠팡 정산은 빠른정산·주정산·월정산 중 무엇을 고르고, 정산유형은 어디서 바꾸나요?", "a": "여건이 되면 월정산이 한 달치가 한눈에 보여 가장 깔끔하지만, 이번 달 정산을 다음 달 말에 주므로 월초 판매분은 약 두 달이 묶인다. 자본금이 적으면 빠른정산을 쓰라고 안내한 것이고, 강사도 공산품 계정 하나에서만 빠른정산을 쓴다(빠른정산은 사업자당 한 계정). 변경은 판매자정보 → 추가판매자정보 → 정산정보 → 정산유형에서 하며, 빠른정산 사용 중이면 무조건 주정산이라 변경 화면이 안 뜬다. 주정산에서 월정산으로 바꾸면 다음 달 1일부터 적용된다.", "by": "강사(하니쌤)"}, {"q": "통신판매업 신고와 현금영수증가맹점 가입은 꼭 해야 하나요?", "a": "통신판매업 신고는 필수다. 국세청에서 오는 현금영수증가맹점 가입 안내도 어차피 나중에 해야 하는 것이라 서류 처리하는 김에 해두는 것이 좋다.", "by": "강사(하니쌤)"}, {"q": "통신판매업 신고는 어디서, 어떤 순서로, 서식은 어떻게 적나요?", "a": "홈택스가 아니라 정부24에서 한다. PPT 77장 순서대로 4번 네이버 스마트스토어 가입을 먼저 해야 구매안전서비스 이용확인증이 나오고, 그것으로 5번 통신판매업 신고증을 받는다. 도메인은 스마트스토어 주소만 되는 것이 아니라 쿠팡에서 팔 예정이면 쿠팡이라고 적어도 되며, 판매방식 인터넷 / 도메인 쿠팡 / 취급품목 식품 / 구체적 품목 건강식품 정도로 적으면 된다. 신고 수수료를 납부해야 신고증이 나온다.", "by": "강사(하니쌤)"}, {"q": "스마트스토어센터에서 구매안전서비스 이용확인증 버튼이 안 보여요.", "a": "PC에서 스마트스토어센터 → 판매자정보 → 판매자 관리 → 판매자 정보 우측 상단에 표시된다. 안 보이면 국내 개인 판매자로 가입한 경우이므로 판매자정보 → 사업자 전환에서 사업자등록증 정보로 전환 신청하면 된다. 전환 심사 중에도 확인증이 바로 보였다는 수강생 사례도 있었다. 통신판매업 신고 전이면 스마트스토어 가입 시 통신판매업 미신고로 두고 진행한다.", "by": "강사(하니쌤)"}, {"q": "토스페이먼츠로 사업자등록을 신청했는데 통장정보·신분증·전자서명 화면이 안 나오고, 사업자등록증에 업종코드도 없어요. 잘못된 건가요?", "a": "토스페이먼츠의 사업자등록 신청과 PG(전자결제) 계약은 별개라서, 사업자등록증이 정상 발급됐으면 등록은 끝난 것이다. 쿠팡·스마트스토어에 입점해 파는 것이므로 PG 계약은 필수가 아니다. 사업자등록증에는 업종코드(525101)가 표시되지 않고 업태 도매 및 소매업 / 종목 전자상거래 소매업으로 나오면 정상이다. 상호명까지만 입력했는데 신청됐다는 카톡을 받았다면 접수된 것이니 다음 날 신청 내역을 확인하면 된다.", "by": "강사(하니쌤)"}, {"q": "사업자를 낸 뒤 보니 브랜드명이 키프리스에 이미 있어요. 사업자를 다시 내야 하나요?", "a": "사업자는 상관없고 브랜드명만 다시 정하면 된다. 한글만 다른데 앞에 영문이 붙은 유사 상표가 검색된 경우도, 리스크를 줄이려면 바꾸는 편이 낫다는 코치 의견이었다.", "by": "강사(하니쌤)"}, {"q": "상표등록은 지금 해야 하나요? 브랜드가 여러 개면 비용이 많이 들지 않나요?", "a": "우선 키프리스에서 겹치지 않는 브랜드명으로 진행하고, 상표권·세금·아이템위너 같은 문제는 판매가 잘된 뒤에 고민해도 늦지 않다. 다만 브랜드명에 애착이 있으면 예방 차원에서 미리 해도 되고 변리사도 소개해 준다. 제품별로 브랜드를 나누는 곳도, 원료 하나를 4~5개 브랜드로 나누는 곳도 있으며 그 정도면 상표 비용은 미미하다.", "by": "코치"}, {"q": "브랜드명은 한글로 쓰나요 영문으로 쓰나요? 제품 나올 때 정하면 되나요?", "a": "표기는 선택이다(오리온·고려은단은 한글, Nike는 영문, 락토핏은 둘 다). 브랜드명은 제품이 나오기 전 기획 단계에서 정해야 한다.", "by": "코치"}, {"q": "위생과에 영업신고 하러 갈 때 건기식이 아니라 일반가공식품이라고 말하라는 게 무슨 뜻인가요? 필요 서류와 교육 접수증은요?", "a": "우리는 건강기능식품이 아니라 일반가공식품을 OEM으로 제조해 내 브랜드로 파는 유통전문판매업이다. 교육 수료증을 내면 알아서 발급해 주며, 사무실 도면 등 서류는 방문 전 위생과에 문의한다. 교육 접수증은 카톡 바코드만 확인했지만 혹시 모르니 출력해 가는 것을 권하고, 교육은 대리인이 가도 된다.", "by": "강사(하니쌤)"}, {"q": "간이과세자와 일반과세자는 무엇이 다르고, 개인사업자로 내는 게 맞나요?", "a": "직전연도 매출 1억 400만 원 미만이면 간이, 이상이면 일반과세자다. 간이는 부가세 환급이 안 되고 일반은 매입세액이 많으면 환급된다. 세금은 번 만큼 내는 것이라 이윤이 크게 줄지는 않는다. 기존 사업자가 있어 간이가 안 되면 일반으로 하고, 법인이 아닌 개인사업자로 등록한다.", "by": "코치"}, {"q": "로켓그로스 상품도 아이템위너로 묶일 수 있나요?", "a": "공산품은 묶일 수 있지만 직접 제조한 내 브랜드 건강식품은 묶이지 않는다. 잘 팔려서 악의적 리셀이 생기면 푸는 방법도 알려 준다.", "by": "코치"}, {"q": "세무서에서 개업일을 뭐라고 적나요? 토스페이먼츠에 넣은 계좌와 스마트스토어 정산계좌가 달라도 되나요?", "a": "아직 판매 전이면 사업 시작 예정일로, 특별한 사유가 없으면 오늘이나 가까운 날짜로 적으면 된다. 스마트스토어 정산계좌는 판매대금을 받을 계좌이므로 토스페이먼츠 신청 때 계좌와 같을 필요가 없다.", "by": "강사(하니쌤)"}], "notices": ["8월 29일(토) 오후 3시 2주차 오프라인 수업 참석 여부 투표 진행, 마감 8월 28일(금) 오후 4시 30분. 미참 시 무편집 현장 녹화본을 머니업클래스 내 강의실에서 수강 가능", "수강생 명단에서 확인되지 않는 프로필은 퇴장 조치 예정. 카카오 프로필을 '이름/휴대폰번호 뒤 4자리' 형식으로 설정할 것", "강의 시청은 머니업클래스 내 강의실, 강의 자료는 각 강의 1교시 영상 하단에서 다운로드. 강의 내용 질문은 톡방, 수강·사이트 이용 문의는 머니업클래스 채널로", "공장견학(익산 제조사·3PL) 9월 29일(화) 확정, 오전반 10시~14시 / 오후반 15시~19시로 나누어 참석 투표 예정. 주말 진행은 제조사·3PL 휴무라 불가하니 연차를 미리 확보할 것", "키워드리포트 자료는 2주차 강의가 끝난 뒤 공유 예정", "오프라인 강의 장소는 서울 강남구 대치동 891-40 인텔빌딩 10층 2호(선릉역 근처), 오후 3시 시작이므로 2시 50분까지 도착. 준비물 노트북·충전기·마우스·필기구. 투표를 못 했어도 참석 가능"], "links": [{"label": "카카오톡 프로필 설정 방법 안내(노션)", "url": "https://foul-sousaphone-367.notion.site/26943e0bd866803fadebdaf8f6c60492"}, {"label": "머니업클래스 사이트(내 강의실)", "url": "https://www.moneyupclass.com/"}, {"label": "강의 시청 방법 안내", "url": "https://buly.kr/CqTRkj"}, {"label": "머니업클래스 카카오 채널(수강·사이트 문의)", "url": "https://pf.kakao.com/_mxffBn"}, {"label": "오프라인 강의 장소 오시는 길", "url": "https://m.site.naver.com/1Iafb"}], "label": "8/26 (수)"}, {"date": "2026-08-25", "summary": "예전 개인판매자로 가입한 스마트스토어에 구매안전서비스 이용확인증 버튼이 없다는 질문에 판매자정보에서 사업자 전환 신청만 하면 버튼이 생긴다는 답 · 운영진의 2주차 오프라인(8/29 토 오후 3시) 참석 여부 투표 안내(마감 8/28 금 4시 30분) · 사업자 등록엔 자가든 비상주든 주소가 필요하고 전세면 계약서 제출, 상호명은 중복돼도 되며 사업자명은 브랜드명과 같아도 달라도 상관없다는 답 · 업태는 도소매업, 종목은 전자상거래업 · 공산품 계정에서 건기식을 같이 팔면 쿠팡에서 분리 분석이 안 되니 건식 비중을 키울 거면 사업자 분리를 권장하고, 한 사업자당 주소 하나라 비상주오피스나 가족 명의 집으로 내며 2시간 온라인 교육은 사업자별로 각각 들어야 한다는 답 · 비상주 주소로 유통전문판매업 영업신고가 가능한지 업체에 묻는 방법과 신고증은 본인이 직접 관할 위생과에 방문해야 하니 거주지 가까운 곳을 고르라는 답 · 쿠팡 빠른정산(셀러월렛)은 최근 신규 셀러에게 바로 열리지 않고 판매이력을 본 뒤 선정되니 개인계좌나 카카오뱅크 사업자계좌로 먼저 시작하라는 공지 · 스마트스토어 출고지·반품지는 3PL(디엔에스로지스) 주소로 하고 스토어명은 사업자명과 달라도 된다는 답 · 사업자등록증 빨리 받는 법과 토스페이먼츠 신청 내역 홈택스 확인 등 수강생 간 팁 공유 · 9/4 방배 오프라인 교육 동행 모집과 서로 응원 · 2023년에 만든 사업자는 그대로 쓰되 교육은 다시 들어야 하고, 세금 혜택을 위한 경기도 주소는 신고증 발급 때 한 번만 방문하면 되니 가까운 경기도라면 추천한다는 답 · 원본대조필 사본 제출·브랜드명 제품 표기·쇼핑쇼츠 쿠팡 연결 질문은 답변 대기", "qa": [{"q": "6년 전 서브 ID로 가입한 스마트스토어에 구매안전서비스 이용확인증 출력 버튼이 없어요.", "a": "예전 계정이 '개인 판매자' 유형이면 버튼이 안 보입니다. 서브 ID로 스마트스토어센터에 로그인해 판매자정보 → 판매자 정보변경 → 사업자 전환에서 현재 사업자등록번호로 전환 신청(통신판매업 신고 여부는 '미신고' 선택)하면, 심사가 끝나기 전이라도 판매자정보 → 판매자 관리 → 판매자 정보 상단에 확인증 버튼이 생겨 출력할 수 있습니다. 사업자등록증·통장 사본 등 서류는 이후 전환 심사 과정에서 제출.", "by": "강사(하니쌤)"}, {"q": "사업자등록 신청은 자택이든 비상주오피스든 사업장 주소가 꼭 있어야 하나요? 전세 세입자는요?", "a": "사업장 주소지가 꼭 필요하며 자가로 해도 되고 비상주오피스로 해도 됩니다. 전세라면 계약서를 제출하면 됩니다.", "by": "강사(하니쌤)"}, {"q": "상호명도 상표권처럼 중복 확인이 필요한가요? 사업자명과 브랜드명을 같게 해도 되나요?", "a": "사업자는 상호가 아니라 사업자번호로 구분되므로 동일한 상호여도 등록 가능하고 확인 절차가 없습니다. 사업자명과 브랜드명은 같아도 달라도 상관없지만, 사업자명을 브랜드명으로 쓸 거라면 꼭 키프리스에서 상표권 검색을 하고 브랜드명은 상표권 없는 이름으로 정합니다.", "by": "강사(하니쌤)"}, {"q": "사업자 업태·종목은 뭐라고 적나요? 비상주오피스 신청서의 업태·특수업종 항목은요?", "a": "업태는 도소매업, 종목은 전자상거래업으로 적으면 됩니다.", "by": "강사(하니쌤)·코치"}, {"q": "스마트스토어 정보 입력란의 스토어명·URL·소개글은 뭘로 쓰나요? 사업자명과 달라도 되나요?", "a": "브랜드명이든 사업자명이든 상관없이 대표님이 운영할 스토어명으로 쓰면 되고, 사업자명과 달라도 됩니다. 필수로 입력하라고 안내된 항목(스토어 주소 등)은 입력해야 합니다.", "by": "강사(하니쌤)"}, {"q": "사업자 하나로 기존 공산품 쿠팡 계정에서 건강식품도 같이 팔면 성과를 나눠 볼 수 있나요? 같은 자택 주소로 사업자를 2개 낼 수 있나요?", "a": "쿠팡에서 건기식과 공산품을 나눌 수 없어 옵션별로 판매·광고 성과를 따로 분석해야 합니다. 건식 SKU를 계속 늘릴 계획이면 잡상인처럼 보여 소비자 신뢰가 떨어질 수 있어 새 사업자로 분리를 권장하고, 부담되면 볼륨이 커진 뒤 분리해도 됩니다. 한 사업자당 주소 하나라 비상주오피스나 가족 명의 집으로 내야 하며, 2시간 온라인 일반판매업 교육은 사업자별로 각각 들어야 합니다. 공산품은 그로스 입고 전이면 삭제, 입고했다면 빼고 품절 처리.", "by": "강사(하니쌤)·코치"}, {"q": "비상주오피스 주소로 영업신고가 되는지 어떻게 확인하나요? 시에서 식품은 불가라는데요. 거주지 가까운 곳을 권하는 이유와 대리인 방문 가능 여부는요?", "a": "사업자등록 자체는 '전자상거래 도소매업'이라 비상주 사용이 가능한 곳이 많지만, 위탁제조 브랜드 판매는 별도로 '유통전문판매업' 영업신고가 필요합니다. 비상주 업체에 '식품 제조업이 아니라 제조는 외부 제조업체가 하고 온라인 판매만 하는데 이 주소로 유통전문판매업 영업신고가 가능한가'라고 다시 묻고, 불가하면 다른 비상주 주소를 구합니다. 비상주어때에서 받은 주소는 등록이 안 된 적이 없었음. 신고증은 해당 지자체 위생과에 본인이 신분증을 들고 직접 가야 하고 대리인은 안 되므로 거주지 가까운 곳을 권장하며, 멀다고 반려되지는 않습니다.", "by": "강사(하니쌤)·코치"}, {"q": "쿠팡 빠른정산(셀러월렛)은 바로 신청되나요? 기존 공산품 계정의 빠른정산 계좌를 새 사업자에 쓸 수 있나요?", "a": "예전엔 신규 셀러도 바로 이용 가능했지만 최근엔 판매이력(보통 3개월, 실적에 따라 더 빨리)을 보고 대상자를 선정하므로 개인계좌나 카카오뱅크 사업자계좌로 먼저 시작하는 게 맞습니다. 상담원마다 안내가 달라 바로 되는 경우도 있음. 빠른정산은 쿠팡 계정당이라 새 사업자에는 기존 계좌를 못 쓸 것.", "by": "강사(하니쌤)"}, {"q": "스마트스토어 출고지와 반품교환지 주소는 어디로 하나요?", "a": "실주문이 들어올 수 있으니 3PL 주소로 해 두는 게 편합니다. 반품교환지도 동일하게. 3PL은 (주)디엔에스로지스, 전북 익산시 함열읍 흘산로 303-8(수강생 공유).", "by": "강사(하니쌤)"}, {"q": "2023년에 만들어 둔 전자상거래 소매업 사업자와 건기식 교육수료증·구매안전서비스 이용확인증·통신판매업신고증을 그대로 써도 되나요?", "a": "사업자는 그대로 써도 되지만 온라인 2시간 교육과 오프라인 4시간 교육은 다시 들어야 합니다.", "by": "강사(하니쌤)"}, {"q": "서울 과밀억제권역이라 세금 혜택을 위해 경기도로 사업자 주소를 내는 게 좋을까요? 내년 2월 김포로 이사 예정이에요.", "a": "신고증 발급 때 한 번만 방문하면 되므로 가까운 경기도라면 경기도로 받을 것 같습니다. 내년 2월이면 금방이라 김포로 받아도 되지만 김포 위생과가 까다롭다는 얘기가 있음.", "by": "강사(하니쌤)"}, {"q": "(수강생 간 공유) 통신판매업 신고 시점, 스마트스토어 가입 조건, 사업자등록증 빨리 받는 법, 토스페이먼츠 접수 확인, 온라인 위생교육 조건은요?", "a": "통신판매업 신고와 스마트스토어 가입은 사업자등록증이 나온 뒤에. 홈택스에서 접수증을 출력하면 담당 세무서 직원 이름·번호가 있어 전화로 빠른 처리를 부탁하면 당일 발급되기도 함. 토스페이먼츠로 신청해도 홈택스 신청내역에서 확인 가능. 온라인 위생교육은 사업자 없이도 수강 가능.", "by": ""}], "notices": ["2주차 오프라인 수업 8/29(토) 오후 3시 — 톡게시판 투표로 참석 여부 제출, 마감 8/28(금) 오후 4시 30분. 미참해도 무편집 현장녹화본을 내 강의실에서 수강 가능", "쿠팡 빠른정산(셀러월렛)은 최근 판매이력 확인 후 대상자 선정으로 바뀌어 신규 셀러는 바로 안 될 수 있음 — 개인계좌나 카카오뱅크 사업자계좌로 먼저 시작", "스마트스토어 출고지·반품교환지는 3PL(디엔에스로지스) 주소로 설정"], "links": [], "label": "8/25 (화)"}, {"date": "2026-08-24", "summary": "제조 지원 코치 소개와 에이브바이오랩스 제조 안내문(OEM 계약서·제조승인요청서·제조 의뢰, 건온연B2B 도매 승인 오전 9시·1시·5시 일괄, 3PL 디엔에스로지스 계약) 공유 · 완강 후 제조하려면 제조업을 추가해야 하냐는 질문에 위탁제조라 불필요하다는 답 · 운영진의 1주차 정규강의 업로드 안내(내 강의실, 강의자료는 1교시 영상 하단)와 1교시 일부 초점 흐림 양해 · 강의실 진입 방법(카카오 로그인 → 내 강의실 → 강의목록) 안내와 수강 문의는 머니업클래스 채널로 · 전세 거주지로 사업자 등록은 임대차계약서 사본 제출이면 된다는 답 · 대면등록권은 제품이 나온 뒤 실제 상품 등록 때 쓰는 것을 권장하며 기한 없이 1회 2시간이라는 답 · 별도 전화번호는 아톡 앱 070번호나 eSIM으로 해결한다는 답 · 제조공장 견학은 9/29(화)로 결정, 오전·오후 투표 예고 · 경기도 사업자의 장점은 과밀억제권역 문제이며 비상주오피스는 비상주어때에 문의하고 최종은 세무사·세무서 확인이라는 답 · 9/9 유통전문판매업 오프라인 교육은 온라인 사전 접수 필수이고 사업자 먼저 내고 듣기 권장, 영업신고증은 사업장 주소지 관할 위생과 · 토스페이먼츠 사업자 등록은 주소 입력 화면이 안 나올 수 있고 한 사업장당 한 주소라는 답 · 2022년 수료한 일반판매업 교육은 유효기간 2년이 지나 다시 들어야 한다는 답 · 온라인·오프라인 강의는 내용과 케어가 동일하고 대면등록도 같다는 답, 강사의 하루 매출 690만 원·광고비 0.76% 공유 · 스마트스토어 가입은 사업자 나온 뒤, 빠른정산 하나은행 계좌 전엔 개인계좌로 시작하라는 답 · 구매안전서비스 이용확인증이 없다는 질문은 답변 대기", "qa": [{"q": "완강 후 제조하려면 사업자등록증에 제조업을 추가해야 하나요?", "a": "위탁제조이기 때문에 사업자등록증에 제조업을 별도로 추가할 필요가 없습니다.", "by": "코치"}, {"q": "업로드된 1주차 강의와 PDF 자료는 어디서 보나요? 내 강의실에 들어가도 강의가 안 보여요.", "a": "머니업클래스에 카카오톡으로 로그인한 뒤 내 강의실 → 강의목록(좌측 상단)에서 1주차 강의를 누르면 됩니다. 총 4개 영상이며 PPT 자료는 1강 1교시 영상 하단에서 다운로드. 매주 토요일 오프라인 강의를 현장 녹화해 올리는 방식이고 6개월간 무제한 수강 가능. 그래도 안 보이면 머니업클래스 채널로 문의.", "by": "강사(하니쌤)"}, {"q": "전세로 사는 집 주소로 사업자를 낼 수 있나요?", "a": "온라인 판매처럼 별도 매장이 필요 없는 경우 전세계약서(임대차계약서) 사본을 제출하면 됩니다. 묵시적 갱신이면 만료된 계약서를 내도 되지만 세무서에서 현재 임대차 관계 확인용 추가 자료를 요청할 수 있습니다.", "by": "강사(하니쌤)"}, {"q": "1:1 대면등록권은 언제 쓰고 몇 회인가요?", "a": "제품이 나오고 나서 실제 상품 등록을 할 때 쓰는 것을 권장하며, 사용 기한이 없으니 천천히 생각해도 됩니다. 1회, 2시간 정도입니다.", "by": "강사(하니쌤)"}, {"q": "직장을 다니며 시작하는데 사업용 전화번호를 따로 만들어야 하나요?", "a": "아톡 앱을 설치하면 070 번호를 쓸 수 있고, eSIM으로 한 폰에 두 번호를 쓸 수도 있습니다.", "by": "강사(하니쌤)"}, {"q": "제조공장 견학 날짜가 정해졌나요?", "a": "직장 때문에 미리 알려 달라는 분들이 많아 9월 29일(화)로 일단 결정됐고, 오전팀·오후팀 참석 여부 투표와 함께 다시 공지 예정. (지원 코치: 견학은 제조사와 협의 후 3~4주차 진행 중 안내)", "by": "강사(하니쌤)"}, {"q": "경기도에서 사업자를 내면 지원제도 등 장점이 있나요? 비상주오피스 주소는 어디서 받나요?", "a": "단순히 경기도라서가 아니라 사업장 주소가 과밀억제권역 안인지 밖인지의 문제입니다. 주소지는 요건 중 하나일 뿐이고 기존 사업 여부·업종·창업 이력에 따라 혜택이 달라지므로 최종은 세무사나 관할 세무서 확인이 가장 정확. 비상주오피스는 '비상주어때'에 문의하면 더 명확한 정보를 받을 수 있습니다. 사업자 이메일은 도메인 없이 네이버·gmail로 충분.", "by": "강사(하니쌤)"}, {"q": "9/9 유통전문판매업 오프라인 교육을 받으려면 그 전에 사업자를 내야 하나요? 예약이 필요한가요? 영업신고증은 어느 위생과에 문의하나요?", "a": "최근엔 사업자가 없어도 신청이 되지만 웬만하면 사업자를 먼저 내고 수료하는 것을 권장. 오프라인 교육은 온라인 접수가 필수이며 인원이 차거나 교육 이틀 전쯤부터는 마감되니 미리 신청(8/26 접수 오픈, 오픈런까지는 불필요). 건기식 영업신고증은 사업장 주소지 관할 위생과. 참고로 강사의 토요일 오프라인 강의 자체는 예약 불필요(운영진).", "by": "강사(하니쌤)"}, {"q": "토스페이먼츠로 사업자 등록을 했는데 사업장 주소 입력이 안 나왔어요. 기존 사업자와 같은 주소로 추가해도 되나요?", "a": "토스페이먼츠 바로신청은 홈택스보다 절차가 간소화돼 주소 입력 화면이 안 나올 수 있으며, 신청 완료됐다면 접수된 것으로 보고 발급 후 사업자등록증의 소재지를 확인하면 됩니다. 정보가 부족하면 추가 확인 요청이 올 수 있음. 사업장 하나당 주소 하나라 같은 주소로 중복 등록은 안 됩니다. 수강생 경험으로는 통장 정보·신분증 촬영 없이 접수돼도 사업자등록증이 정상 발급됐다고 함.", "by": "강사(하니쌤)"}, {"q": "2022년에 위생교육센터 일반판매업 신규 교육을 수료했으면 다시 안 들어도 되나요?", "a": "유효기간 2년이 지났으므로 갱신하거나 다시 들어야 합니다.", "by": "강사(하니쌤)"}, {"q": "사업자 통장은 하나은행에 방문해야 하나요? 월정산이면 아무 통장이나 되나요? 전체 순서는 어떻게 되나요?", "a": "하나은행 통장도 온라인 개설이 가능하며, 월정산으로 받을 거면 어떤 통장을 써도 됩니다. 순서는 강의에서 설명한 그대로 진행하면 되고, 빠른정산용 하나은행 통장을 개설하려면 쿠팡 판매자 가입이 먼저라, 그 전에 계좌 등록이 필요한 단계는 일단 개인 계좌로 하고 나중에 빠른정산 계좌로 변경하면 됩니다. 스마트스토어 가입은 사업자등록증이 나온 뒤에.", "by": "강사(하니쌤)"}, {"q": "브랜드명을 정했으면 로고도 만들어야 하나요? 영어 브랜드명도 되나요? 사업자명·브랜드 기획을 미리 조언받을 수 있나요?", "a": "로고를 따로 만드는 업체도, 브랜드명 자체를 로고로 쓰는 업체도 많고 영어·한글 모두 가능하니 2주차 기획 강의를 들으며 천천히 정하면 됩니다(코치). 사업자명은 크게 중요하지 않아 먼저 내도 되지만, 매 강의마다 방향이 달라지므로 제조는 완강 후를 권장. 이번주 강의에서 썸네일·상세페이지 디자인 팁을 다루니 먼저 보고 편하게 연락(강사).", "by": "강사(하니쌤)·코치"}], "notices": ["제조 지원 코치 소개 — 에이브바이오랩스 제조 관련 문의는 판단은 세무사나 관할 세무서에 확인합니다.", "dates": ["2026-08-24", "2026-08-25", "2026-09-10"]}, {"category": "사업자 등록·세금", "q": "간이과세자와 일반과세자 중 뭘로 내나요?", "a": "직전연도 매출 1억 400만 원 미만이면 간이, 이상이면 일반입니다. 간이는 부가세 환급이 안 되고 일반은 매입세액이 많으면 환급됩니다. 기존에 일반사업자가 있으면 간이가 안 되므로 그냥 일반으로 내면 되고, 그렇게 해도 괜찮습니다.", "dates": ["2026-08-26", "2026-09-01"]}, {"category": "사업자 등록·세금", "q": "이미 온라인 판매 사업자가 있는데 새로 내야 하나요?", "a": "기존 사업자로 건강식품도 팔 수 있습니다. 온·오프라인 교육 두 가지를 수료하고 영업신고증만 받으면 되고, 통신판매업신고증과 구매안전서비스 이용확인증은 그대로 씁니다. 다만 공산품과 건강식품을 한 계정에 섞으면 성과 분석이 어렵고 소비자 신뢰가 떨어질 수 있어, 건강식품 품목을 늘릴 계획이면 새 사업자로 분리를 권합니다. 볼륨이 커진 뒤 분리해도 됩니다.", "dates": ["2026-08-23", "2026-08-25", "2026-08-27"]}, {"category": "사업자 등록·세금", "q": "가족 명의로 사업자를 내도 되나요?", "a": "직장 겸업 등의 사유로 가족 명의로 내는 경우가 있습니다. 다만 4시간 집합 위생교육은 대리인이 직원이어야 하므로 1인 사업자라면 대표자 본인이 직접 가야 합니다.", "dates": ["2026-08-23", "2026-08-27", "2026-09-10"]}, {"category": "영업신고·위생교육", "q": "위생교육은 뭘 들어야 하고, 예전에 들은 수료증은 쓸 수 있나요?", "a": "온라인 2시간(건강기능식품 일반판매업)과 오프라인 4시간 집합교육(유통전문판매업) 두 가지입니다. 수료증 유효기간은 2년이라 2022년 이전 수료증은 다시 들어야 합니다. 온라인 교육은 사업자 없이도 들을 수 있지만, 수료증에 사업자 상호와 주소가 적히므로 사업자를 먼저 내고 듣는 것을 권합니다. 집합교육은 온라인 접수가 필수이고 교육 이틀 전쯤 마감되니 미리 신청하세요. 4시간 온라인 교육을 이미 들었다면 2시간 교육을 안 들어도 되는 경우가 있지만 지자체마다 다르니 위생과에 확인합니다. 10월에 들어도 늦지 않습니다.", "dates": ["2026-08-23", "2026-08-24", "2026-08-25", "2026-08-28"]}, {"category": "영업신고·위생교육", "q": "영업신고는 어디서 하고, 뭘 가져가나요?", "a": "사업장 주소지 관할 위생과에 본인이 신분증을 들고 직접 갑니다. 정부24 온라인 신청도 됩니다. 우리는 건강기능식품이 아니라 일반가공식품을 OEM으로 만들어 내 브랜드로 파는 유통전문판매업이라고 설명하면 됩니다. 필요 서류는 담당자마다 달라 수료증만으로 1시간 만에 나온 경우도, 임대차·OEM·3PL 계약서까지 낸 경우도 있습니다. 방문 전 위생과에 전화해 서류를 확인하고 한 번에 갖춰 가세요. 위생교육 접수증은 폰 바코드 대신 출력해 가는 편이 안전합니다.", "dates": ["2026-08-26", "2026-09-06", "2026-09-09", "2026-09-10"]}, {"category": "영업신고·위생교육", "q": "집 주소라서 영업신고가 반려됐어요. 어떻게 하나요?", "a": "일반 거주 건축물이라 반려되면 비상주오피스를 계약해 그 주소로 신고합니다. 집 주소는 창고로 분류할 수 없다며 창고 계약서를 요구하면 3PL 물류 계약서를 내면 됩니다. 임대차계약서가 배우자 명의면 사용승낙서 같은 추가 증빙을 담당자에게 물어보세요. 지자체에 따라 아파트 주소로 받아준 곳도 있습니다.", "dates": ["2026-09-10", "2026-09-11"]}, {"category": "영업신고·위생교육", "q": "위생과에서 OEM 계약서나 제조사 영업등록증을 요구해요.", "a": "OEM 계약서는 공지 댓글에 코치가 올린 양식으로 작성해 가져갑니다. 영업등록증은 OEM 제조업체의 것을 말하며, 물류·OEM 계약서 맨 끝장에 붙어 있고 없으면 업체에 문의해 받습니다. 계약 날짜가 안 보인다고 반려되면 계약서를 캡처해 한글 파일로 만들어 담당자 메일로 보내 통과한 사례가 있습니다.", "dates": ["2026-09-10", "2026-09-11"]}, {"category": "통신판매업·스마트스토어", "q": "통신판매업 신고는 어디서, 어떤 순서로 하나요?", "a": "홈택스가 아니라 정부24에서 합니다. 순서는 사업자등록증 → 네이버 스마트스토어 가입 → 구매안전서비스 이용확인증 출력 → 통신판매업 신고 → 수수료 납부 후 신고증 발급. 판매방식 인터넷, 취급품목 식품, 구체적 품목 건강식품 정도로 적습니다. 도메인은 쿠팡으로 적어도 통과되지만 시청에서 네이버로 하라고 하면 스마트스토어 주소로 적으면 됩니다. 처리 기간은 안내상 72시간이고 전화하면 빨라집니다. 현금영수증가맹점 가입도 어차피 해야 하니 같이 해 두세요.", "dates": ["2026-08-26", "2026-08-29", "2026-09-02"]}, {"category": "통신판매업·스마트스토어", "q": "스마트스토어에 구매안전서비스 이용확인증 버튼이 안 보여요.", "a": "PC에서 스마트스토어센터 → 판매자정보 → 판매자 관리 → 판매자 정보 우측 상단에 있습니다. 안 보이면 국내 개인 판매자로 가입된 경우이니 판매자정보 → 사업자 전환에서 사업자등록증 정보로 전환 신청하세요. 심사가 끝나기 전에도 버튼이 바로 생깁니다. 통신판매업 신고 전이면 가입 시 미신고로 두고 진행합니다.", "dates": ["2026-08-25", "2026-08-26", "2026-08-28"]}, {"category": "통신판매업·스마트스토어", "q": "스마트스토어 가입 정보는 뭘로 적나요?", "a": "업종은 전자상거래 소매업, 통신판매업 신고 전이면 미신고로 진행합니다. 스토어명·URL·소개글은 사업자명과 달라도 되고 브랜드명을 적지 않아도 됩니다. 출고지와 반품교환지는 실주문이 들어올 수 있으니 3PL 주소로 해 둡니다. 정산계좌는 토스페이먼츠 신청 때 계좌와 같을 필요가 없습니다.", "dates": ["2026-08-25", "2026-08-26", "2026-08-27", "2026-08-29"]}, {"category": "쿠팡 입점·정산", "q": "쿠팡윙 가입은 언제 하고, 비즈니스 형태는 뭘 고르나요?", "a": "사업자등록증만 있으면 가입할 수 있습니다. 비즈니스 형태는 브랜드 오너/제조, 대표 카테고리는 식품. 고객확인제도 등록하기 항목은 서류를 다 냈으면 안 보이는 것이 정상이고, 판매자 정보 검수 승인까지 하루 정도 걸립니다. 지금 꼭 해야 하는 건 아니지만 미리 입점해 두면 2~3강의 쿠팡윙 사용법을 바로 따라 할 수 있습니다. 반품지의 택배사 계약여부는 없음, 제주·도서산간 배송불가 표시가 맞습니다.", "dates": ["2026-08-27", "2026-08-28", "2026-08-31"]}, {"category": "쿠팡 입점·정산", "q": "쿠팡 입점이 내부심사기준으로 거부됐어요.", "a": "사업자등록증의 업태가 도매 및 소매업, 종목이 전자상거래 소매업으로 되어 있는지 먼저 확인하고 재신청합니다. 콜센터는 자동응답만 돌아가니 이메일로 거부 사유를 받아 보는 것이 좋습니다. 반복 반려 시 판매자 지원 메일에 사업자등록증 업태 부분을 표시한 사진과 반려 문서를 붙여 보낸 사례가 있습니다. 업체코드 오류가 나면 판매자정보 입력을 다 마쳤는지 확인하세요.", "dates": ["2026-09-01", "2026-09-04"]}, {"category": "쿠팡 입점·정산", "q": "정산은 빠른정산·주정산·월정산 중 뭘 고르나요? 빠른정산이 안 돼요.", "a": "여건이 되면 월정산이 가장 깔끔하지만 월초 판매분은 약 두 달 묶입니다. 자본금이 적으면 빠른정산을 쓰되, 최근에는 판매이력(보통 3개월)을 보고 대상자를 정하므로 신규 계정은 대상자가 아니라고 나옵니다. 그때는 개인계좌나 사업자통장으로 시작하고, 3강 내용대로 올라 선정산을 쓰다가 판매내역이 생기면 쿠팡 승인 후 전환합니다. 빠른정산은 사업자당 한 계정이고 하나은행 계좌가 필요합니다. 정산유형 변경은 판매자정보 → 추가판매자정보 → 정산정보에서 하며, 주정산에서 월정산으로 바꾸면 다음 달 1일부터 적용됩니다.", "dates": ["2026-08-24", "2026-08-25", "2026-08-26", "2026-08-28", "2026-09-10"]}, {"category": "쿠팡 입점·정산", "q": "로켓그로스와 윙판매(판매자배송)는 뭐가 다른가요?", "a": "로켓그로스는 쿠팡 창고에 재고를 넣어 두고 쿠팡이 배송하는 방식, 윙판매(판매자배송)는 3PL 창고에서 발송하는 방식입니다. 쿠팡 창고 입고에는 바코드 작업과 박스 서류 부착이 필요한데 이 작업을 3PL이 대신해 주므로 3PL을 거칩니다. 제작한 물량은 전부 쿠팡으로 보내지 않고 일부를 3PL에 두어 판매자배송용으로 씁니다.", "dates": ["2026-08-22", "2026-08-31", "2026-09-04", "2026-09-11"]}, {"category": "OEM·3PL 계약", "q": "OEM 계약서는 언제 쓰고, 어떻게 작성하나요?", "a": "제조 진행 시 필요한 계약서지만 영업신고 때 위생과에 낼 수 있으니 미리 써 두면 수월합니다. 개인사업자는 사업자등록번호나 주민등록번호 중 하나만 적고 법인등록번호란은 하이픈(-)만 표시합니다. 도장은 안 파도 되고 서명만 하면 됩니다. OEM 사이트 가입 승인은 매일 오후 5시에 일괄 처리됩니다. 사업자 정보가 바뀌어 다시 써야 하거나 기타 문의는 제조사 1:1 채널 상담으로 합니다.", "dates": ["2026-09-01", "2026-09-03", "2026-09-08", "2026-09-09"]}, {"category": "OEM·3PL 계약", "q": "계약서를 다운받으면 감사추적인증서만 나와요.", "a": "받은 zip 파일을 열기만 하지 말고 압축을 풀면 안에 계약서 PDF가 있습니다. 그래도 없으면 OEM 계약서는 제조사(에이브바이오랩스) 1:1 채널 상담, 3PL 계약서는 물류업체(디앤에스로지스) 담당자에게 문의하면 카톡이나 PDF로 바로 보내줍니다. 휴대폰에서 열어 카톡으로 보낸 뒤 카톡에서 내려받는 방법도 있습니다. 완료된 3PL 계약서는 글자 위치가 어긋나 보이지만 다들 같습니다.", "dates": ["2026-09-05", "2026-09-07", "2026-09-08", "2026-09-10"]}, {"category": "OEM·3PL 계약", "q": "3PL 물류비는 얼마고, 계약일자는 며칠로 적나요?", "a": "보증금은 없고 택배를 보낼 때마다 택배비가 들며 보관비는 파레트당 2만 원 정도입니다. 계약일자는 3PL 대표에게 문의하면 되고, 편한 대로 적으면 된다는 답을 받았습니다. OEM 제조비용은 기본 현금 선납이지만 카드결제 시 할부가 됩니다.", "dates": ["2026-08-22", "2026-08-27", "2026-09-03", "2026-09-07"]}, {"category": "브랜드·강의·일정", "q": "브랜드명은 언제 정하고, 상표등록은 지금 해야 하나요?", "a": "브랜드명은 제품이 나오기 전 기획 단계(2주차)에서 정하고, 한글·영문 표기는 자유입니다. 반드시 키프리스에서 상표권 검색을 해서 겹치지 않는 이름으로 정하세요. 사업자 상호는 사업자번호로 구분되므로 중복이어도 상관없고, 브랜드명이 겹쳐도 사업자를 다시 낼 필요 없이 브랜드명만 바꾸면 됩니다. 상표 출원은 브랜드가 어느 정도 큰 뒤에 해도 늦지 않고, 애착이 있으면 미리 해도 됩니다. Health, Balance 같은 단어를 덧붙여도 됩니다.", "dates": ["2026-08-24", "2026-08-25", "2026-08-26", "2026-08-27", "2026-08-28", "2026-09-11"]}, {"category": "브랜드·강의·일정", "q": "강의 영상과 자료는 어디서 보나요?", "a": "머니업클래스에 카카오톡으로 로그인 → 내 강의실 → 강의목록. 매주 토요일 오프라인 강의를 현장 녹화해 월요일에 올리고, 일요일 줌 라이브도 녹화본이 올라갑니다. 6개월간 무제한 수강. PPT 자료는 각 주차 1교시 영상 하단에서 내려받고, 마진계산기·원료리포트는 단톡방에서 배포합니다. 강의 내용 질문은 톡방, 수강·사이트 문의는 머니업클래스 카카오 채널로 합니다.", "dates": ["2026-08-23", "2026-08-24", "2026-08-28", "2026-08-31", "2026-09-01"]}, {"category": "브랜드·강의·일정", "q": "마진계산기는 어떻게 입력하나요?", "a": "원가는 제조사 견적서의 부가세 포함 금액을 수량으로 나눈 개당 금액, 배송비는 부가세 포함 금액을 적습니다. 판매FEE는 부가세 전 요율(약 10%)을 적으면 수식에서 1.1을 곱해 처리합니다. 품목당 부가세는 포함돼 있고, 종합소득세는 나중에 매입·매출을 보고 따로 계산합니다.", "dates": ["2026-09-03"]}, {"category": "브랜드·강의·일정", "q": "공장견학은 언제, 어떻게 가나요?", "a": "9월 29일(화) 전북 익산 제조사·3PL 견학. 오전반 10시~14시, 오후반 15시~19시로 나누며 따로 정원은 없고 자리 때문에 나누는 것입니다. 주말 진행은 제조사 휴무라 불가하니 연차를 확보하세요. 오전·오후반 투표는 4강 이후 진행 예정이고, 카풀이나 기차를 함께 예약하자는 의견이 있었습니다.", "dates": ["2026-08-24", "2026-08-26", "2026-09-01", "2026-09-13", "2026-09-14"]}], "qa_total": 149, "built_at": "2026-09-15 09:51", "start_label": "8/21"};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const nl = s => esc(s).replace(/\n/g, "<br>");
let query = "";

function hl(html){
  if(!query) return html;
  const re = new RegExp("(" + query.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "gi");
  return html.split(/(<[^>]+>)/g).map(p => p.startsWith("<") ? p : p.replace(re, "<mark>$1</mark>")).join("");
}
function hit(...parts){ if(!query) return true; const t = parts.flat().filter(Boolean).join(" ").toLowerCase(); return t.includes(query.toLowerCase()); }

function renderHead(){
  document.title = DATA.title || "톡방 핵심 정리";
  $("#h1").innerHTML = esc(DATA.title || "").replace(/\s*\|\s*/g, "<br>");
  $("#sub").textContent = [DATA.room, DATA.start_label ? DATA.start_label + " 시작" : ""].filter(Boolean).join(" · ");
  if(DATA.badge) $("#badge-text").textContent = DATA.badge;
  if(DATA.notice && DATA.notice.length){ $("#notice").hidden = false; $("#notice-body").innerHTML = DATA.notice.map(n => `<p>${esc(n)}</p>`).join(""); }
  $("#st-start").textContent = DATA.start_label || "-";
  $("#st-cohort").textContent = DATA.cohort || "-";
  $("#st-qa").textContent = DATA.qa_total ?? 0;
  if(DATA.update_note){ $("#update-note").hidden = false; $("#update-note").textContent = "이번 갱신: " + DATA.update_note; }
  $("#foot").textContent = `마지막 갱신 ${DATA.built_at} · ${DATA.days.length}일치 정리`;
}

function qaHtml(list){
  return `<div class="qa">` + list.map(x => `
    <div class="item">
      <div class="q"><span class="k">Q</span><div>${hl(nl(x.q))}</div></div>
      <div class="a"><span class="k">A</span><div>${hl(nl(x.a))}</div></div>
      ${x.by ? `<div class="by">답변 · ${esc(x.by)}</div>` : ""}
    </div>`).join("") + `</div>`;
}

function renderDays(){
  const box = $("#panel-days");
  const days = DATA.days.filter(d => hit(d.summary, (d.qa||[]).map(x => x.q + " " + x.a), d.notices, (d.links||[]).map(l => l.label)));
  if(!days.length){ box.innerHTML = `<div class="empty">검색 결과가 없습니다.</div>`; return; }
  box.innerHTML = days.map((d, i) => {
    const isLatest = d.date === DATA.days[0].date;
    const secs = [];
    if((d.qa||[]).length) secs.push(`<div class="sec"><h3>질문과 답변 ${d.qa.length}건</h3>${qaHtml(d.qa)}</div>`);
    if((d.notices||[]).length) secs.push(`<div class="sec"><h3>공지</h3><ul class="plain">${d.notices.map(n => `<li>${hl(nl(n))}</li>`).join("")}</ul></div>`);
    if((d.links||[]).length) secs.push(`<div class="sec"><h3>링크</h3><ul class="plain">${d.links.map(l => `<li><a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label||l.url)}</a></li>`).join("")}</ul></div>`);
    return `<details class="day" ${query || i === 0 ? "open" : ""}>
      <summary>
        <div class="dh"><span class="arrow">▲</span><span class="date">${esc(d.label)}</span>${isLatest ? `<span class="new">최신</span>` : ""}<span class="cnt">Q&amp;A ${(d.qa||[]).length}</span></div>
        <div class="summary">${hl(nl(d.summary))}</div>
      </summary>
      <div class="body">${secs.join("") || `<p class="empty">이날은 요약만 있습니다.</p>`}</div>
    </details>`;
  }).join("");
}

function renderFaq(){
  const box = $("#panel-faq");
  const faq = (DATA.faq||[]).filter(x => hit(x.q, x.a, x.category));
  if(!faq.length){ box.innerHTML = `<div class="empty">${DATA.faq && DATA.faq.length ? "검색 결과가 없습니다." : "아직 정리된 자주 묻는 질문이 없습니다."}</div>`; return; }
  const groups = {};
  faq.forEach(x => { (groups[x.category || "기타"] ||= []).push(x); });
  box.innerHTML = Object.entries(groups).map(([cat, items]) => `
    <div class="cat"><h2>${esc(cat)} <span class="n">${items.length}</span></h2>
    <div class="qa">${items.map(x => `
      <div class="item">
        <div class="q"><span class="k">Q</span><div>${hl(nl(x.q))}</div></div>
        <div class="a"><span class="k">A</span><div>${hl(nl(x.a))}</div></div>
        ${(x.dates||[]).length ? `<div class="chips">${x.dates.map(dt => `<span class="chip">${esc(dt.slice(5).replace("-","/"))}</span>`).join("")}</div>` : ""}
      </div>`).join("")}</div></div>`).join("");
}

function selectTab(which){
  const days = which === "days";
  $("#tab-days").setAttribute("aria-selected", days);
  $("#tab-faq").setAttribute("aria-selected", !days);
  $("#panel-days").hidden = !days;
  $("#panel-faq").hidden = days;
  try{ localStorage.setItem("digest-tab", which); }catch(e){}
}
$("#tab-days").addEventListener("click", () => selectTab("days"));
$("#tab-faq").addEventListener("click", () => selectTab("faq"));
$("#q").addEventListener("input", e => { query = e.target.value.trim(); renderDays(); renderFaq(); });

renderHead(); renderDays(); renderFaq();
try{ selectTab(localStorage.getItem("digest-tab") === "faq" ? "faq" : "days"); }catch(e){ selectTab("days"); }
</script>
